name: Publish Helm chart to Harbor

# Helm pushes the chart as an OCI artifact to Harbor alongside the
# images. Customers can install with either:
#
#   # OCI install (recommended)
#   helm install orbital oci://cr.calltheory.com/orbital/charts/orbital \
#       --version 1.2.3 -n orbital
#
#   # Or git clone + local path
#   git clone --branch v1.2.3 https://git.calltheory.com/orbital/orbital.git
#   helm install orbital ./orbital/deploy/helm/orbital -n orbital
#
# Both stay supported; the OCI route avoids needing the source repo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version (semver, no leading v)'
        required: true
        type: string
        default: '0.1.2'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Compute chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading `v` — Helm semver requires no prefix.
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint chart
        run: helm lint deploy/helm/orbital

      - name: Render chart against every per-provider values file
        run: |
          for vals in deploy/helm/orbital/values-*.yaml; do
            echo "==> rendering with $vals"
            helm template orbital deploy/helm/orbital -n orbital -f "$vals" >/dev/null
          done

      - name: Package chart
        run: |
          helm package deploy/helm/orbital \
              --version ${{ steps.version.outputs.version }} \
              --app-version ${{ steps.version.outputs.version }} \
              --destination /tmp/charts

      - name: Log in to Harbor (Helm OCI)
        # Pass Harbor secrets through `env:` rather than splicing them
        # into the shell line directly. Project-scoped Harbor robots
        # have usernames like `robot$orbital+pusher`; if you do
        # `--username "${{ secrets.HARBOR_USERNAME }}"`, Forgejo
        # substitutes the literal string into the script and bash then
        # expands `$orbital` as a variable (= empty), corrupting the
        # username. `env:` puts the value in a real env var, and
        # `"$VAR"` expands once with no further re-parsing.
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          # printf %s, NOT echo — echo appends \n which helm registry
          # login treats as part of the password and rejects.
          printf '%s' "$HARBOR_PASSWORD" | helm registry login "$HARBOR_REGISTRY" \
              --username "$HARBOR_USERNAME" \
              --password-stdin

      - name: Push chart
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
        run: |
          helm push "/tmp/charts/orbital-${{ steps.version.outputs.version }}.tgz" \
              "oci://${HARBOR_REGISTRY}/orbital/charts"

      - name: Report
        env:
          HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
        run: |
          echo "Chart pushed to oci://${HARBOR_REGISTRY}/orbital/charts/orbital:${{ steps.version.outputs.version }}"
          echo
          echo "Customers install via:"
          echo "  helm install orbital oci://${HARBOR_REGISTRY}/orbital/charts/orbital \\"
          echo "      --version ${{ steps.version.outputs.version }} \\"
          echo "      -n orbital --create-namespace \\"
          echo "      -f values-vultr-k3s.yaml   # or whichever provider"
