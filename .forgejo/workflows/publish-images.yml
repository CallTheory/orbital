name: Publish images to Harbor

# Delegates the actual build/push/sign work to the org-level reusable
# workflow at calltheory/.forgejo-workflows. That workflow handles:
#   - docker buildx build + push to ${HARBOR_REGISTRY}/orbital/<image>
#   - tag set: git-SHA + latest + any extra-tags supplied
#   - Cosign signing by digest
#
# Triggered reactively when the `Application Tests` workflow completes successfully
# (via workflow_run). The if: gate fires only on tag pushes (v*) or
# main-branch pushes; PR test completions are filtered out so PR runs
# don't push images. workflow_dispatch remains an escape hatch for
# operator-driven hotfix builds.
#
# Pin: @main during iteration; switch to @v1 once their workflow cuts a
# release tag.

on:
  workflow_run:
    workflows: ["Application Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag to publish (e.g. 1.2.3-hotfix). Optional.'
        required: false
        type: string
        default: ''

jobs:
  tag:
    # Gate: dispatch always allowed; otherwise only fire after a Test
    # run that succeeded and originated from a push to main or a v*
    # tag. PR test completions evaluate to false (event != push).
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && (
          github.event.workflow_run.head_branch == 'main' ||
          startsWith(github.event.workflow_run.head_branch, 'v')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      extra: ${{ steps.compute.outputs.extra }}
    steps:
      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
              # Manual dispatch with explicit extra-tag (e.g. hotfix build).
              echo "extra=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
              # Auto-trigger: derive extra from the head_branch of the
              # Application Tests workflow run that completed.
              HEAD="${{ github.event.workflow_run.head_branch }}"
              if [[ "${HEAD}" == v* ]]; then
                  # v1.2.3 → 1.2.3 (matches Helm chart appVersion).
                  echo "extra=${HEAD#v}" >> "$GITHUB_OUTPUT"
              else
                  # main push → no extra-tag, only :latest + :SHA get applied.
                  echo "extra=" >> "$GITHUB_OUTPUT"
              fi
          fi

  build:
    needs: tag
    strategy:
      fail-fast: false
      # One reusable-workflow call per image — they run in parallel.
      matrix:
        include:
          - name: laravel
            dockerfile: Dockerfile
            context: .
          - name: asterisk
            dockerfile: Dockerfile
            context: docker/asterisk
          - name: agent-worker
            dockerfile: Dockerfile
            context: agent-worker
    uses: actions/.forgejo-workflows/.forgejo/workflows/orbital-cosign.yml@main
    with:
      image-name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      extra-tags: ${{ needs.tag.outputs.extra }}
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - name: Report
        run: |
          echo "Published images to <HARBOR_REGISTRY>/orbital/{laravel,asterisk,agent-worker}"
          echo "Each image is Cosign-signed by digest."
          echo
          echo "Pull with:"
          echo "  docker pull <HARBOR_REGISTRY>/orbital/laravel:<tag>"
          echo "Deploy with:"
          echo "  helm upgrade --install orbital oci://<HARBOR_REGISTRY>/orbital/charts/orbital \\"
          echo "      --version <tag> --set global.image.tag=<tag>"
