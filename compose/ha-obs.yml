# Orbital HA observability tier — Phase H.
#
# Second instances of Grafana, Prometheus, and Loki so the
# reporting/dashboard surface stays available alongside the rest
# of the stack. The plan upgraded Grafana from "single-instance,
# fine if down briefly" to "customer-facing reporting surface —
# always up" — this compose file implements that.
#
# Shared state:
#   - Grafana:   Postgres `grafana` database on the Patroni cluster
#                (dashboards, users, datasources, alerts live here
#                so the nodes themselves stay stateless).
#   - Prometheus: per-node TSDB storage. Both scrape the same
#                 targets independently. Minor query-time drift is
#                 acceptable for dashboard use.
#   - Loki:      shared SeaweedFS S3 bucket `loki-chunks`. Any node
#                can answer any query against the shared chunks.
#
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f compose/ha-data.yml \
#                  -f compose/ha-app.yml \
#                  -f compose/ha-telephony.yml \
#                  -f compose/ha-edge.yml \
#                  -f compose/ha-obs.yml up -d

services:
    grafana-2:
        image: 'grafana/grafana:latest'
        # No host port binding — HAProxy `grafana` frontend
        # balances across both grafana nodes.
        environment:
            GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-admin}'
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_ANALYTICS_REPORTING_ENABLED: 'false'
            # Offline-first: disable grafana.com plugin preinstall +
            # update checks (see grafana in docker-compose.yml).
            GF_PLUGINS_PREINSTALL_DISABLED: 'true'
            GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
            GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
            GF_AUTH_PROXY_ENABLED: 'true'
            GF_AUTH_PROXY_HEADER_NAME: 'X-WEBAUTH-USER'
            GF_AUTH_PROXY_HEADER_PROPERTY: 'username'
            GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
            GF_AUTH_PROXY_HEADERS: 'Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME'
            GF_AUTH_PROXY_WHITELIST: '172.16.0.0/12,127.0.0.1'
            GF_USERS_AUTO_ASSIGN_ORG_ROLE: 'Viewer'
            GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/admin/grafana/'
            GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
            # Same Postgres DB as grafana-1 → shared state.
            GF_DATABASE_TYPE: 'postgres'
            GF_DATABASE_HOST: '${DB_HOST:-haproxy}:${DB_PORT:-5432}'
            GF_DATABASE_NAME: 'grafana'
            GF_DATABASE_USER: '${DB_USERNAME:-orbital}'
            GF_DATABASE_PASSWORD: '${DB_PASSWORD:-password}'
            GF_DATABASE_SSL_MODE: 'disable'
        volumes:
            - './docker/grafana/provisioning:/etc/grafana/provisioning:ro'
            - 'sail-grafana-2:/var/lib/grafana'
        networks:
            - sail
        restart: unless-stopped

    prometheus-2:
        image: 'prom/prometheus:latest'
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.console.libraries=/etc/prometheus/console_libraries
            - --web.console.templates=/etc/prometheus/consoles
            - --web.enable-lifecycle
        volumes:
            - './docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
            - './docker/prometheus/rules:/etc/prometheus/rules:ro'
            - 'sail-prometheus-2:/prometheus'
        networks:
            - sail
        restart: unless-stopped

    loki-2:
        image: 'grafana/loki:latest'
        user: '0'
        command: '-config.file=/etc/loki/local-config.yaml -config.expand-env=true'
        environment:
            AWS_ACCESS_KEY_ID: 'orbital'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY}'
        volumes:
            - './docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro'
            - 'sail-loki-2:/loki-data'
        networks:
            - sail
        restart: unless-stopped

    # ------------------------------------------------------------
    # Metric exporters — sidecars that translate services without
    # native Prometheus endpoints into scrapeable /metrics.
    #
    # Everything else is scraped directly: Patroni REST (:8008),
    # etcd (:2379), HAProxy stats (:8404/metrics), SeaweedFS
    # (-metricsPort=9324), LiveKit (prometheus.port 6789), Loki,
    # Grafana. See docker/prometheus/prometheus.yml for the job
    # list. These live in the obs overlay (not ha-data) because
    # they're monitoring plumbing, not part of the data tier's
    # failover story — but they do probe ha-data services, so
    # they're only useful with the full COMPOSE_FILE stack loaded.
    # ------------------------------------------------------------

    # DB-level Postgres stats (connections, TPS, table/index IO).
    # Points at the HAProxy rw frontend so it always follows the
    # Patroni leader. Node-level cluster state (who is leader,
    # replica lag) comes from the patroni job's /metrics instead.
    # Uses the postgres superuser for now — swap to a dedicated
    # pg_monitor role when we harden credentials.
    # Second Alertmanager. The pair GOSSIPS over port 9094 rather than
    # sharing storage: each node tells the other what it has already
    # sent, which is what stops a duplicate notification when both
    # Prometheus nodes fire the same alert at the same instant.
    #
    # --cluster.peer points at the other node by service name. Docker's
    # embedded DNS resolves it once the peer exists; before that
    # Alertmanager retries rather than failing to start, so boot order
    # does not matter.
    alertmanager-2:
        build:
            context: ./docker/alertmanager
        environment:
            ALERT_SMTP_SMARTHOST: '${ALERT_SMTP_SMARTHOST:-mailpit:1025}'
            ALERT_SMTP_FROM: '${ALERT_SMTP_FROM:-alerts@orbital.test}'
            ALERT_SMTP_USERNAME: '${ALERT_SMTP_USERNAME:-}'
            ALERT_SMTP_PASSWORD: '${ALERT_SMTP_PASSWORD:-}'
            ALERT_SMTP_REQUIRE_TLS: '${ALERT_SMTP_REQUIRE_TLS:-false}'
            ALERT_EMAIL_TO: '${ALERT_EMAIL_TO:-}'
            ALERT_WEBHOOK_URL: '${ALERT_WEBHOOK_URL:-}'
            ALERT_EXTERNAL_URL: '${ALERT_EXTERNAL_URL:-http://localhost:9093}'
        command:
            - '--cluster.listen-address=0.0.0.0:9094'
            - '--cluster.peer=alertmanager:9094'
        volumes:
            - 'sail-alertmanager-2:/alertmanager'
        networks:
            - sail
        restart: unless-stopped

    # Second Tempo, for installs that also load compose/obs-tracing.yml.
    # Harmless without it — the container starts, finds the same
    # `tempo-traces` bucket, and serves queries against blocks the other
    # node wrote. Sharing the bucket is what makes either node able to
    # answer any query, exactly as Loki does with `loki-chunks`.
    #
    # Defined here rather than in obs-tracing.yml so the HA overlay stays
    # the single place that says "make the observability tier redundant".
    tempo-2:
        image: 'grafana/tempo:latest'
        user: '0'
        command: '-config.file=/etc/tempo/tempo.yaml -config.expand-env=true'
        environment:
            AWS_ACCESS_KEY_ID: 'orbital'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY}'
        volumes:
            - './docker/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro'
            - 'sail-tempo-2:/tempo-data'
        networks:
            - sail
        restart: unless-stopped

    postgres-exporter:
        image: 'prometheuscommunity/postgres-exporter:latest'
        environment:
            DATA_SOURCE_NAME: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres-dev}@haproxy:5432/postgres?sslmode=disable'
        networks:
            - sail
        restart: unless-stopped

    # Valkey stats via the redis protocol. Runs in multi-target
    # mode: prometheus hits /scrape?target=redis://valkey-N:6379
    # once per node (see the `valkey` job's relabel config), so a
    # single exporter covers the whole replica set and we can see
    # per-node role/replication state — not just the master view
    # through HAProxy.
    redis-exporter:
        image: 'oliver006/redis_exporter:latest'
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD}'
        networks:
            - sail
        restart: unless-stopped

volumes:
    sail-alertmanager-2:
        driver: local
    sail-tempo-2:
        driver: local
    sail-grafana-2:
        driver: local
    sail-prometheus-2:
        driver: local
    sail-loki-2:
        driver: local
