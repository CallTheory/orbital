# Orbital — Ansible inventory example.
#
# Copy to `hosts.ini` (which is .gitignored) and fill in your VM
# IPs + SSH user. The OpenTofu modules under deploy/terraform/
# generate this automatically via `local-exec` after the VMs come
# up; this file is the on-prem / manual path.

# ============================================================
# Edge VMs — Kamailio + rtpengine
# ============================================================
[edge_vms]
edge-1 ansible_host=10.0.0.10
edge-2 ansible_host=10.0.0.11

[edge_vms:vars]
ansible_user=orbital
ansible_ssh_private_key_file=~/.ssh/orbital-deploy

# ============================================================
# K3s cluster (skip if using managed K8s)
# ============================================================
[k3s_servers]
k3s-server-1 ansible_host=10.0.0.20 k3s_first_server=true
k3s-server-2 ansible_host=10.0.0.21
k3s-server-3 ansible_host=10.0.0.22

[k3s_agents]
k3s-agent-1 ansible_host=10.0.0.30
k3s-agent-2 ansible_host=10.0.0.31

[k3s_servers:vars]
ansible_user=orbital
ansible_ssh_private_key_file=~/.ssh/orbital-deploy
k3s_server_url=https://10.0.0.20:6443

[k3s_agents:vars]
ansible_user=orbital
ansible_ssh_private_key_file=~/.ssh/orbital-deploy
k3s_server_url=https://10.0.0.20:6443
