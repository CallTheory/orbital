---
# K3s bootstrap — installs K3s server + agents on the
# `k3s_servers` and `k3s_agents` inventory groups.
#
# Skipped entirely on managed K8s installs (VKE / EKS / AKS) —
# those provision the cluster via cloud APIs in OpenTofu, no
# Ansible needed.
#
# Required inventory variables:
#   k3s_token: shared cluster token (Vault / Terraform output)
#   k3s_server_url: https://<first-server-ip>:6443
#
# The first server in `k3s_servers` must have
# `k3s_first_server: true` set in host_vars — that triggers the
# `--cluster-init` bootstrap. Subsequent servers + agents join.

- name: Install K3s — first server (bootstrap)
  hosts: "k3s_servers[0]"
  become: true
  gather_facts: true

  vars:
    k3s_role: server
    k3s_first_server: true

  pre_tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

  roles:
    - role: common
    - role: k3s

  post_tasks:
    - name: Capture kubeconfig from first server
      # Replace the loopback address in the rendered kubeconfig
      # with the server's reachable IP so operators using `kubectl`
      # from outside don't have to fix it manually.
      ansible.builtin.command: cat /etc/rancher/k3s/k3s.yaml
      register: k3s_kubeconfig_text
      changed_when: false

    - name: Write kubeconfig to local controller (for operator use)
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../../{{ inventory_hostname }}.kubeconfig"
        content: "{{ k3s_kubeconfig_text.stdout | regex_replace('127.0.0.1', ansible_host) }}"
        mode: "0600"
      delegate_to: localhost
      become: false

- name: Install K3s — additional servers (HA control plane)
  hosts: "k3s_servers[1:]"
  become: true
  gather_facts: true
  vars:
    k3s_role: server
    k3s_first_server: false
  roles:
    - role: common
    - role: k3s

- name: Install K3s — agents
  hosts: k3s_agents
  become: true
  gather_facts: true
  vars:
    k3s_role: agent
  roles:
    - role: common
    - role: k3s
