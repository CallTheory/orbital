---
# k3s — installs K3s server or agent via the official `get.k3s.io`
# install script. The script is idempotent (re-runs detect existing
# install + just re-apply systemd unit + tokens).
#
# First server bootstraps with `--cluster-init`; subsequent servers
# join via `--server <url> --token <T>`; agents always have a
# `K3S_URL` env var set so the script wires them as workers.

- name: Bail if k3s_token is not set
  ansible.builtin.fail:
    msg: "k3s_token must be set (generate with `openssl rand -hex 32`)"
  when: k3s_token | length == 0

- name: Bail if non-first node is missing k3s_server_url
  ansible.builtin.fail:
    msg: "k3s_server_url must point at the first server (e.g. https://10.0.0.10:6443)"
  when:
    - (k3s_role == 'agent') or (k3s_role == 'server' and not (k3s_first_server | default(false)))
    - k3s_server_url | length == 0

- name: Build INSTALL_K3S_EXEC for server-bootstrap (first server)
  ansible.builtin.set_fact:
    k3s_install_exec: >-
      server --cluster-init
      {% for d in k3s_disable %}--disable {{ d }} {% endfor %}
      {% for arg in k3s_extra_args %}{{ arg }} {% endfor %}
  when: k3s_role == 'server' and (k3s_first_server | default(false))

- name: Build INSTALL_K3S_EXEC for additional servers
  ansible.builtin.set_fact:
    k3s_install_exec: >-
      server --server {{ k3s_server_url }}
      {% for d in k3s_disable %}--disable {{ d }} {% endfor %}
      {% for arg in k3s_extra_args %}{{ arg }} {% endfor %}
  when: k3s_role == 'server' and not (k3s_first_server | default(false))

- name: Build INSTALL_K3S_EXEC for agents
  ansible.builtin.set_fact:
    k3s_install_exec: >-
      agent --server {{ k3s_server_url }}
      {% for arg in k3s_extra_args %}{{ arg }} {% endfor %}
  when: k3s_role == 'agent'

- name: Run K3s install script
  ansible.builtin.shell:
    cmd: |
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION={{ k3s_version }} \
        INSTALL_K3S_EXEC="{{ k3s_install_exec }}" \
        K3S_TOKEN={{ k3s_token }} \
        sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for K3s service to be active
  ansible.builtin.systemd:
    name: "{{ 'k3s' if k3s_role == 'server' else 'k3s-agent' }}"
    state: started
    enabled: true

- name: Read kubeconfig back from server (first node only)
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw
  when: k3s_role == 'server' and (k3s_first_server | default(false))

# Surface the kubeconfig content to subsequent plays so the install
# script can chain into `helm install` directly. The OpenTofu
# wrapper script also reads it via `local-exec` after the playbook
# finishes.
- name: Persist kubeconfig at /etc/rancher/k3s/k3s.yaml (default)
  ansible.builtin.set_fact:
    k3s_kubeconfig_b64: "{{ k3s_kubeconfig_raw.content }}"
  when:
    - k3s_role == 'server'
    - k3s_first_server | default(false)
    - k3s_kubeconfig_raw is defined

- name: Allow K8s API + node-to-node ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: 6443, proto: tcp, comment: "K3s API (kubectl, kubelet)" }
    - { port: 10250, proto: tcp, comment: "kubelet metrics" }
    - { port: 8472, proto: udp, comment: "Flannel VXLAN" }
    - { port: 51820, proto: udp, comment: "Flannel WireGuard (if enabled)" }
  when: common_ufw_enabled | default(true)
