#cloud-config
# Orbital edge VM cloud-init — bootstrap stub.
#
# OpenTofu renders this template (substituting the dollar-brace vars) and
# passes the result as userdata to each Vultr / on-prem / cloud VM.
# The VM comes up, installs ansible, pulls the edge-bootstrap
# playbook from the repo, and runs it against itself. End state:
# kamailio + rtpengine + recording-daemon + acme.sh client all
# installed, configured, and started.
#
# Tofu vars expected (rendered before write):
#   ansible_repo_url    e.g. https://github.com/calltheory/orbital.git
#   ansible_branch      e.g. main
#   admin_authorized_keys  newline-separated SSH public keys
#   certs_acme_email    ACME email
#   certs_acme_domain   e.g. sip.orbital.calltheory.com
#   certs_acme_webhook_url    Laravel TLS webhook URL
#   certs_acme_webhook_token  webhook shared secret
#   kamailio_dispatcher_targets_yaml  YAML-list of K8s Asterisk endpoints
#   kamailio_dmq_peers_yaml   YAML-list of peer edge VM hostnames

package_update: true
package_upgrade: false   # let admins control patching cadence

packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - ansible
  - curl
  - ca-certificates

write_files:
  # Group_vars file the playbook reads to pick up tofu-output values.
  # Written at userdata expansion time so secrets never live in the repo.
  - path: /etc/orbital-deploy/group_vars/edge_vms.yml
    permissions: '0600'
    content: |
      ---
      common_admin_authorized_keys:
        ${admin_authorized_keys}

      certs_acme_email: ${certs_acme_email}
      certs_acme_domain: ${certs_acme_domain}
      certs_acme_webhook_url: ${certs_acme_webhook_url}
      certs_acme_webhook_token: ${certs_acme_webhook_token}

      kamailio_dispatcher_targets:
        ${kamailio_dispatcher_targets_yaml}
      kamailio_dmq_peers:
        ${kamailio_dmq_peers_yaml}

runcmd:
  # ansible-pull clones the repo, runs the edge-bootstrap playbook
  # against localhost, and exits. cloud-init logs land in
  # /var/log/cloud-init-output.log for post-mortem.
  - |
    cd /tmp && git clone --depth 1 --branch ${ansible_branch} ${ansible_repo_url} orbital-repo
    cd /tmp/orbital-repo/deploy/ansible
    cp /etc/orbital-deploy/group_vars/edge_vms.yml inventory/group_vars/edge_vms.yml || \
      mkdir -p inventory/group_vars && cp /etc/orbital-deploy/group_vars/edge_vms.yml inventory/group_vars/edge_vms.yml
    ansible-playbook \
      -i 'localhost,' \
      -c local \
      -e "ansible_host=$$(hostname -I | awk '{print $$1}')" \
      playbooks/edge-bootstrap.yml \
      2>&1 | tee /var/log/orbital-bootstrap.log

final_message: "Orbital edge bootstrap complete in $${UPTIME} seconds."
