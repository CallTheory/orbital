{{- if .Values.ingress.enabled -}}
{{/*
Public ingress for Orbital. Routes HTTPS to the Laravel admin panel
and WSS for the Reverb broadcast server. Per-host TLS via
cert-manager (or a manually-provisioned secret named in
`tls[].secretName`).

The provider-specific ingressClassName comes from values:
  values-vultr-k3s.yaml → traefik
  values-vultr-vke.yaml → nginx (VKE default)
  values-onprem-k3s.yaml → traefik
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orbital.componentName" (list . "ingress") }}
  labels:
    {{- include "orbital.componentLabels" (list . "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "orbital.componentName" (list $ .service) }}
                port:
                  number: {{ if eq .service "reverb" }}{{ $.Values.reverb.service.port }}{{ else }}{{ $.Values.laravel.service.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
