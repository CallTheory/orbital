{{- if .Values.laravel.enabled -}}
{{/*
Laravel — the Filament admin panel + the API the agent-worker calls.
Single Deployment with horizontal autoscaling-friendly knobs;
stateless. Backed by external Postgres / Valkey (in-cluster or
managed depending on the *.external.enabled flags).

Connection details land via the shared `orbital-app-env` ConfigMap
plus the secrets the customer / installer creates (see
secrets.example.yaml).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbital.componentName" (list . "laravel") }}
  labels:
    {{- include "orbital.componentLabels" (list . "laravel") | nindent 4 }}
spec:
  replicas: {{ .Values.laravel.replicas }}
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "laravel") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "laravel") | nindent 8 }}
      annotations:
        {{/* Roll pods when the failover-tier ConfigMap changes — env
             vars only re-read on pod start. */}}
        checksum/failover-tiers: {{ include (print $.Template.BasePath "/configmap-failover-tiers.yaml") . | sha256sum }}
    spec:
      {{- include "orbital.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: laravel
          image: {{ include "orbital.image" (dict "ctx" . "name" .Values.laravel.image.name "tag" .Values.laravel.image.tag) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.laravel.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "orbital.componentName" (list . "failover-tiers") }}
            - configMapRef:
                name: {{ include "orbital.componentName" (list . "app-env") }}
            - secretRef:
                name: {{ include "orbital.componentName" (list . "app-secrets") }}
          env:
            {{- range $k, $v := .Values.laravel.env }}
            - name: {{ $k | quote }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.laravel.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /up        # Laravel 11+ default healthcheck endpoint
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: asterisk-shared-config
              mountPath: /var/www/html/docker/asterisk/config
            - name: asterisk-shared-prompts
              mountPath: /var/spool/asterisk/prompts
      volumes:
        # Shared with the Asterisk StatefulSet — Laravel writes the
        # generated dialplan; Asterisk reads it on `module reload`.
        # ReadWriteMany PVC required (NFS, longhorn, EFS, etc.); on
        # K3s with local-path this works only for single-node clusters,
        # which is fine for dev / small installs.
        - name: asterisk-shared-config
          persistentVolumeClaim:
            claimName: {{ include "orbital.componentName" (list . "asterisk-config") }}
        - name: asterisk-shared-prompts
          persistentVolumeClaim:
            claimName: {{ include "orbital.componentName" (list . "asterisk-prompts") }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
