[edge_vms]
%{ for i, ip in edge_vm_ips ~}
edge-${i + 1} ansible_host=${ip}
%{ endfor ~}

[edge_vms:vars]
ansible_user=${ssh_user}
ansible_ssh_private_key_file=${ssh_private_key_path}

[k3s_servers]
%{ for i, ip in k3s_server_ips ~}
k3s-server-${i + 1} ansible_host=${ip}%{ if i == 0 } k3s_first_server=true%{ endif }
%{ endfor ~}

[k3s_servers:vars]
ansible_user=${ssh_user}
ansible_ssh_private_key_file=${ssh_private_key_path}

[k3s_agents]
%{ for i, ip in k3s_agent_ips ~}
k3s-agent-${i + 1} ansible_host=${ip}
%{ endfor ~}

[k3s_agents:vars]
ansible_user=${ssh_user}
ansible_ssh_private_key_file=${ssh_private_key_path}
