services:
    # ──────────────────────────────────────────────────────────────────
    # TLS terminator — nginx reverse proxy on port 443.
    # Terminates HTTPS + WSS and proxies to the app (80) + Reverb
    # (8080). Reads cert from the tls-certs shared volume. On first
    # boot with no cert, the entrypoint generates a temporary self-
    # signed cert so the admin can reach the dashboard to configure
    # acme.sh and issue a real one.
    # ──────────────────────────────────────────────────────────────────
    nginx-tls:
        build:
            context: ./docker/nginx
            dockerfile: Dockerfile
        # nginx-tls owns BOTH host ports — 443 for HTTPS (primary)
        # and 80 for the HTTP→HTTPS redirect. The Laravel app
        # container (`orbital.test`) no longer binds port 80 on the
        # host; it listens on 80 inside the sail network only, and
        # nginx proxies to it after TLS termination.
        ports:
            - '${APP_PORT:-80}:80'
            - '443:443'
        volumes:
            - 'tls-certs:/etc/nginx/certs'
        networks:
            - sail
        depends_on:
            - orbital.test
        restart: unless-stopped

    # ──────────────────────────────────────────────────────────────────
    # acme.sh — ACME client for Let's Encrypt cert issuance + renewal.
    # Runs as a daemon with a built-in cron that auto-renews every 60
    # days. DNS-01 validation so certs work without public HTTP. After
    # each renewal, the deploy hook POSTs to Laravel's webhook which
    # dispatches service-reload jobs.
    #
    # DNS provider credentials come from .env — each provider has its
    # own set of env vars (e.g. CF_Token + CF_Zone_ID for Cloudflare).
    # See: https://github.com/acmesh-official/acme.sh/wiki/dnsapi
    # ──────────────────────────────────────────────────────────────────
    acme:
        image: 'neilpang/acme.sh:latest'
        command: ['daemon']
        environment:
            # Cloudflare (default example — change to match your DNS provider)
            CF_Token: '${ACME_DNS_CF_TOKEN:-}'
            CF_Zone_ID: '${ACME_DNS_CF_ZONE_ID:-}'
            # AWS Route53 (uncomment if using Route53 instead)
            # AWS_ACCESS_KEY_ID: '${ACME_DNS_AWS_ACCESS_KEY_ID:-}'
            # AWS_SECRET_ACCESS_KEY: '${ACME_DNS_AWS_SECRET_ACCESS_KEY:-}'
            # Webhook config for deploy hooks
            ACME_WEBHOOK_URL: 'http://orbital.test/api/tls/renewed'
            ACME_WEBHOOK_TOKEN: '${ACME_WEBHOOK_TOKEN:-}'
        volumes:
            - 'tls-certs:/etc/acme-certs'
            - 'acme-data:/acme.sh'
            - './docker/acme/deploy-hook.sh:/opt/deploy-hook.sh:ro'
        networks:
            - sail
        restart: unless-stopped

    orbital.test:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # Port 80 is no longer host-bound — nginx-tls owns both 80
        # and 443 on the host. The app still listens on 80 inside
        # the sail network so nginx can proxy to it, but external
        # HTTP requests hit nginx first and get 301'd to HTTPS.
        # Vite dev server stays host-bound for HMR.
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            # Shared Asterisk recordings volume — mounted read-only into
            # the app container so UploadCallRecordingJob can stream
            # completed MixMonitor files to MinIO. Asterisk writes, we
            # upload-and-delete.
            - 'asterisk-recordings:/var/spool/asterisk/monitor'
            # Shared voicemail spool — Asterisk writes mailbox WAVs here
            # via the VoiceMail() dialplan app, and TranscribeVoicemailJob
            # reads the file at the same container-local path the
            # externnotify webhook hands it.
            - 'asterisk-voicemail-spool:/var/spool/asterisk/voicemail'
            # Shared disclosure-prompts volume — orbital.test renders
            # TTS audio files here, asterisk plays them back at call
            # time. Keyed by content hash, so identical messages across
            # tenants share a single file.
            - 'asterisk-prompts:/var/spool/asterisk/prompts'
            # Shared TLS cert volume — CertificateService reads
            # the PEM files here for the admin dashboard + health
            # probe. Read-only because Laravel never writes certs.
            - 'tls-certs:/etc/tls:ro'
            # Read-only mounts of each rtpengine node's recording-
            # daemon spool. The `orbital:upload-recordings` watcher
            # walks these dirs every minute, parses Call-ID +
            # direction from the filename, dispatches an upload job
            # per finalized WAV. Read-only so we can't accidentally
            # disturb a file mid-flush — the upload job deletes via
            # the rtpengine container's writable mount.
            - 'rtpengine-1-spool:/var/spool/rtpengine/rtpengine-1:ro'
            - 'rtpengine-2-spool:/var/spool/rtpengine/rtpengine-2:ro'
        networks:
            - sail
            - telephony
        depends_on:
            - mailpit

    # pgAdmin 4 — web-based Postgres admin UI. Pre-wired to the
    # orbital pgsql instance via `./docker/pgadmin/servers.json`
    # which pgAdmin auto-imports on first boot, so the server
    # shows up under "Servers → Orbital" without manual setup.
    # Password is NOT pre-filled (pgpass would be required and
    # it's not worth the complication for a dev tool) — enter
    # it once and pgAdmin remembers it in its own profile DB
    # which persists via the sail-pgadmin volume.
    #
    # Runs in `desktop mode` (SERVER_MODE=False + no master
    # password) so there's no per-user registration flow — one
    # admin account from env vars, straight into the browser.
    # In prod you'd flip SERVER_MODE=True and front it with TLS
    # + a real admin email/password from secrets.
    # Redis Commander — lightweight web UI for Valkey. Valkey is
    # a drop-in Redis fork and speaks the unmodified Redis protocol,
    # so any Redis client (including Commander) connects without
    # special support. Useful for browsing keys during dev: cache
    # entries, session blobs, Horizon queue state, Reverb channel
    # subscribers.
    #
    # Auth is handled ENTIRELY by the Laravel reverse proxy at
    # /admin/redis-commander/* (session + tooling.redis_commander
    # permission). Commander's own auth is disabled so its SPA
    # doesn't try to show a login form — same pattern as
    # SeaweedFS filer and Prometheus where the backend has no
    # auth and the proxy is the sole trust boundary.
    #
    # The container is loopback-bound so only the host machine
    # can reach it directly; all admin traffic goes through the
    # proxy.
    redis-commander:
        image: 'rediscommander/redis-commander:latest'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_COMMANDER_PORT:-8082}:8081'
        environment:
            REDIS_HOSTS: 'local:valkey:6379:0:${REDIS_PASSWORD}'
            # No HTTP_USER / HTTP_PASSWORD / SSO — auth is disabled
            # so the SPA skips its login form entirely. All access
            # is gated by the Laravel proxy route instead.
        networks:
            - sail
        restart: unless-stopped

    pgadmin:
        image: 'dpage/pgadmin4:latest'
        entrypoint: ['/opt/entrypoint-tls.sh']
        ports:
            - '${FORWARD_PGADMIN_PORT:-5050}:443'
        environment:
            # Server mode replaces the old "desktop" single-user
            # profile with a proper multi-user install. Users come
            # in exclusively via OAuth2 against Laravel's OIDC
            # endpoints — the default email/password pair below is
            # kept as a break-glass fallback only; pgAdmin's
            # authentication_sources setting below excludes the
            # internal form unless SSO is explicitly disabled.
            PGADMIN_DEFAULT_EMAIL: 'admin@orbital.app'
            PGADMIN_DEFAULT_PASSWORD: 'password'
            PGADMIN_CONFIG_SERVER_MODE: 'True'
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
            # Allow emails on special-use / reserved TLDs (.test,
            # .local, .example, .invalid) so OIDC-provisioned
            # users with `@orbital.test` and similar addresses
            # pass pgAdmin's email validator. Without this pgAdmin
            # 500s on the OAuth2 callback because email-validator
            # rejects reserved TLDs by default.
            PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: 'False'
            PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['test', 'local', 'example', 'invalid']"
            # pgAdmin serves its own TLS using the shared cert
            # volume rather than going through the Laravel reverse
            # proxy. Flask's session-based OAuth2 flow breaks
            # through a proxy because the Set-Cookie path and
            # redirect chain lose session state across the
            # authorize round-trip. Direct HTTPS avoids that.
            PGADMIN_ENABLE_TLS: 'True'
            PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
            # OAuth2 SSO against the Laravel OIDC provider. pgAdmin
            # discovers the token/authorize/userinfo endpoints from
            # the /.well-known/openid-configuration URL so we only
            # have to hardcode the one metadata URL.
            PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['oauth2']"
            PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER: 'True'
            PGADMIN_CONFIG_OAUTH2_CONFIG: |
                [{
                    "OAUTH2_NAME": "orbital",
                    "OAUTH2_DISPLAY_NAME": "Orbital",
                    "OAUTH2_CLIENT_ID": "${PGADMIN_OAUTH2_CLIENT_ID}",
                    "OAUTH2_CLIENT_SECRET": "${PGADMIN_OAUTH2_CLIENT_SECRET}",
                    "OAUTH2_TOKEN_URL": "http://orbital.test/oauth/token",
                    "OAUTH2_AUTHORIZATION_URL": "https://orbital.test/oauth/authorize",
                    "OAUTH2_USERINFO_ENDPOINT": "http://orbital.test/oauth/userinfo",
                    "OAUTH2_SCOPE": "openid email profile",
                    "OAUTH2_ICON": "fa-solid fa-key",
                    "OAUTH2_BUTTON_COLOR": "#4f46e5"
                }]
        volumes:
            - 'sail-pgadmin:/var/lib/pgadmin'
            - './docker/pgadmin/servers.json:/pgadmin4/servers.json:ro'
            - './docker/pgadmin/entrypoint-tls.sh:/opt/entrypoint-tls.sh:ro'
            - 'tls-certs:/etc/tls:ro'
        tmpfs:
            # Writable scratch space for the TLS entrypoint to copy
            # cert files with the names pgAdmin expects. Using tmpfs
            # instead of a named volume because the content is
            # ephemeral (refreshed from tls-certs on every boot).
            - /certs
        networks:
            - sail
        depends_on:
            - orbital.test
        restart: unless-stopped

    # Legacy single-node `pgsql` and `valkey` services were removed
    # once the HA data tier landed. The app now talks to Postgres
    # through haproxy → Patroni (compose/ha-data.yml) and to Valkey
    # through haproxy → Sentinel-elected master. Bring the HA
    # overlays up alongside this file:
    #
    #   docker compose -f docker-compose.yml -f compose/ha-data.yml up -d
    #
    # See docs/ENVIRONMENT.md for the per-tier topology.

    # Laravel Reverb — self-hosted websocket broadcasting server. Runs
    # `php artisan reverb:start` inside a fresh copy of the app image
    # so it has every model/event class available without a separate
    # build. Clients connect via ws://localhost:8080 from the browser
    # on dev; production fronts the same port with TLS under the app
    # domain. Credentials live in .env (REVERB_APP_*).
    #
    # Bound to both networks so the app container can reach it for
    # authz callbacks AND future services on the telephony network can
    # push events (operator availability, call state) onto the same bus.
    reverb:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        command: ['php', '/var/www/html/artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - telephony
        restart: unless-stopped

    # Laravel scheduler — runs `schedule:work` which loops forever
    # and fires every task in routes/console.php at its configured
    # cadence (scheduler heartbeat, recording retention prune, the
    # queue-metrics rollup, etc.). Without this container, those
    # jobs silently stop running. Replaces the "run `schedule:work`
    # in a second terminal" dev pattern with a supervised container
    # that auto-restarts.
    scheduler:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        command: ['php', '/var/www/html/artisan', 'schedule:work']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        restart: unless-stopped

    # Laravel Horizon — dedicated queue worker process. Runs as its
    # own container so queued jobs (voicemail transcription +
    # email, inbound mail processing, broadcast events, etc.) get
    # picked up automatically whenever the stack is running — no
    # manual `sail artisan horizon` in a second terminal. Docker's
    # restart policy replaces supervisord for crash recovery.
    horizon:
        build:
            context: ./docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        command: ['php', '/var/www/html/artisan', 'horizon']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
            # Mount the voicemail spool so TranscribeVoicemailJob
            # running here can read the WAV Asterisk wrote.
            - 'asterisk-voicemail-spool:/var/spool/asterisk/voicemail'
            # Mount the recordings volume too so future jobs that
            # upload MixMonitor output to S3 don't fail the same
            # way the voicemail job did before this mount landed.
            - 'asterisk-recordings:/var/spool/asterisk/monitor'
            # Shared TTS-prompt volume — any job that renders
            # audio for Asterisk to play back drops it here.
            - 'asterisk-prompts:/var/spool/asterisk/prompts'
        networks:
            - sail
            - telephony
        restart: unless-stopped

    mailpit:
        image: 'axllent/mailpit:latest'
        # Always running as a debug mail trap. In production,
        # MAIL_HOST points at the real SMTP relay — Mailpit only
        # captures mail when you explicitly flip MAIL_HOST=mailpit
        # for debugging. Ports are loopback-bound because the web
        # UI has no auth; admin access goes through Laravel's
        # /admin/mailpit/* proxy route which adds session gating.
        # SMTP port 1025 stays loopback too — the app container
        # reaches it via `mailpit:1025` on the sail network.
        #
        # --webroot tells Mailpit to serve all URLs (API, assets,
        # WebSocket) under /admin/mailpit/ so they natively match
        # the proxy route prefix. No URL rewriting needed in the
        # Laravel proxy — Mailpit generates correct paths itself.
        command: ['--webroot', '/admin/mailpit']
        ports:
            - '127.0.0.1:${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    # Haraka SMTP → HTTP webhook shim. Accepts inbound SMTP at
    # the network edge and POSTs each message to Laravel's
    # /api/mail/inbound endpoint. Stateless; all routing,
    # parsing, and storage lives in Laravel. This is the
    # self-hosted equivalent of SendGrid Inbound Parse.
    #
    # Host port 2525 → container 25. Port 25 is usually blocked
    # on Linux dev hosts by systemd-resolved or stock Postfix,
    # so we use 2525 locally; production maps to whatever the
    # MX record points at. Test with:
    #   swaks --server localhost:2525 --from test@example.com \
    #         --to 12345@inbound.orbital.test \
    #         --header "Subject: ping" --body "hello"
    haraka:
        build:
            context: ./docker/haraka
            dockerfile: Dockerfile
        ports:
            - '${FORWARD_INBOUND_SMTP_PORT:-2525}:25'
        environment:
            ORBITAL_WEBHOOK_URL: 'http://orbital.test/api/mail/inbound'
            ORBITAL_WEBHOOK_TOKEN: '${INBOUND_MAIL_TOKEN}'
        networks:
            - sail
        depends_on:
            - orbital.test
        restart: unless-stopped

    # Kamailio — SIP signaling proxy in front of Asterisk.
    # All inbound SIP trunk traffic enters here on 5060; Kamailio
    # dispatches it to Asterisk on the internal telephony network.
    # Provides call draining for maintenance: the admin UI marks
    # the Asterisk backend as "inactive" via JSON-RPC, Kamailio
    # stops sending new calls but lets existing dialogs finish,
    # operator restarts Asterisk after the last call completes.
    #
    # What bypasses Kamailio (goes directly to Asterisk):
    #   - Operator softphone WebRTC (WSS 8089)
    #   - LiveKit SIP bridge (5069)
    #   - RTP media (10000-10099) — signaling-only proxy
    #   - Outbound trunk registrations (Asterisk → provider)
    kamailio:
        build:
            context: ./docker/kamailio
            dockerfile: Dockerfile
        ports:
            - '5060:5060/udp'
            - '5060:5060/tcp'
            - '5061:5061/tcp'
            # WSS listener for operator softphones (Phase 1b). SipJS
            # in the operator panel connects to wss://sip-edge:7443/.
            - '7443:7443/tcp'
            # JSON-RPC management for the admin UI's drain/activate
            # controls. Loopback-only because it has no auth — the
            # app container reaches it via the telephony network,
            # not the host port.
            - '127.0.0.1:8090:8090/tcp'
        volumes:
            # Bind-mount the dispatcher list so Laravel can regenerate
            # it from the AsteriskBackend table on save and trigger a
            # dispatcher.reload via JSON-RPC. Without this mount the
            # file is baked into the image at build time and admin UI
            # changes would require a rebuild to take effect.
            - './docker/kamailio/dispatcher.list:/etc/kamailio/dispatcher.list'
            # Bind-mount kamailio.cfg so iteration on the routing
            # script doesn't require rebuilding the image. Phase 1b
            # turned this into a moving target (rtpengine_manage,
            # DMQ, TLS, websocket) — a baked-in copy lags every edit.
            - './docker/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg'
            # TLS profile + cert chain shared with nginx-tls / Asterisk.
            # Reloaded on every cert renewal via KamailioService::reloadTls().
            - './docker/kamailio/tls.cfg:/etc/kamailio/tls.cfg'
            - 'tls-certs:/etc/tls:ro'
        networks:
            - telephony
        depends_on:
            - asterisk-1
        restart: unless-stopped

    # ──────────────────────────────────────────────────────────────────
    # rtpengine — edge media relay.
    # Two nodes (rtpengine-1 / rtpengine-2) match the registered rows in
    # the `rtpengine_nodes` table so Failover Central + the Dashboard
    # health card key off real reachable daemons. Phase 1a runs them in
    # userspace mode (no `xt_RTPENGINE` kernel module); Kamailio's
    # `rtpengine_manage()` integration that actually relays RTP through
    # them lands in the next chunk of work.
    # ──────────────────────────────────────────────────────────────────
    rtpengine-1:
        image: drachtio/rtpengine:latest
        # Both nodes are flagged active (no keepalived warm-standby
        # in this topology). Phase 3's load-bearing change is the
        # `--redis` flag below: rtpengine state lives in the shared
        # Valkey cluster, so an in-flight call relayed through this
        # node survives the node going away — node-2 picks up the
        # signaling cleanup from the same state. HAProxy fronts the
        # Valkey master across the 3-node Sentinel pool so a Valkey
        # failover is transparent to rtpengine.
        #
        # Shell-form entrypoint so $REDIS_PASSWORD is expanded inside
        # the container; drachtio's image doesn't substitute env into
        # exec-form args.
        entrypoint:
            - sh
            - -c
            - >-
                exec rtpengine
                --foreground
                --log-stderr
                --interface=eth0
                --listen-ng=0.0.0.0:22222
                --port-min=23000
                --port-max=23099
                --recording-dir=/var/spool/rtpengine
                --recording-method=pcap
                --recording-format=eth
                --log-level=5
                --redis="$$REDIS_PASSWORD@haproxy:6379/3"
                --redis-num-threads=2
                --redis-allowed-errors=20
                --no-redis-required
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD}'
        volumes:
            - 'rtpengine-1-spool:/var/spool/rtpengine'
        networks:
            - sail
            - telephony
        restart: unless-stopped

    rtpengine-2:
        image: drachtio/rtpengine:latest
        entrypoint:
            - sh
            - -c
            - >-
                exec rtpengine
                --foreground
                --log-stderr
                --interface=eth0
                --listen-ng=0.0.0.0:22222
                --port-min=23000
                --port-max=23099
                --recording-dir=/var/spool/rtpengine
                --recording-method=pcap
                --recording-format=eth
                --log-level=5
                --redis="$$REDIS_PASSWORD@haproxy:6379/3"
                --redis-num-threads=2
                --redis-allowed-errors=20
                --no-redis-required
        environment:
            REDIS_PASSWORD: '${REDIS_PASSWORD}'
        volumes:
            - 'rtpengine-2-spool:/var/spool/rtpengine'
        networks:
            - sail
            - telephony
        restart: unless-stopped

    asterisk-1:
        build:
            context: ./docker/asterisk
            dockerfile: Dockerfile
        # SIP 5060/5061 are no longer host-bound — inbound SIP
        # enters via Kamailio on the telephony network instead.
        # AMI (5038), WSS softphone (8089), and RTP media
        # (10000-10099) stay host-bound because they bypass the
        # proxy by design.
        ports:
            - '5038:5038/tcp'
            - '8089:8089/tcp'
            - '10000-10099:10000-10099/udp'
        environment:
            # ARA / ODBC connection — the entrypoint envsubst's these
            # into /etc/odbc.ini at boot. Same names as Laravel's .env
            # so the two containers see the same Postgres.
            DB_HOST: '${DB_HOST:-pgsql}'
            DB_PORT: '${DB_PORT:-5432}'
            DB_DATABASE: '${DB_DATABASE:-orbital}'
            DB_USERNAME: '${DB_USERNAME:-orbital}'
            DB_PASSWORD: '${DB_PASSWORD:-password}'
            # Stamps ps_contacts.reg_server per-registration so the
            # SIP Proxy page can show how many dynamic registrations
            # THIS Asterisk actually holds vs its sibling.
            ASTERISK_NODE_NAME: 'asterisk-1'
            # Voicemail-by-email relay — Asterisk calls /usr/sbin/sendmail
            # (msmtp-mta) and msmtp forwards to MAIL_HOST:MAIL_PORT. In
            # dev that's Mailpit; in prod set via .env to your real relay.
            MAIL_HOST: '${MAIL_HOST:-mailpit}'
            MAIL_PORT: '${MAIL_PORT:-1025}'
            MAIL_USERNAME: '${MAIL_USERNAME:-}'
            MAIL_PASSWORD: '${MAIL_PASSWORD:-}'
            MAIL_ENCRYPTION: '${MAIL_ENCRYPTION:-}'
            MAIL_FROM_ADDRESS: '${MAIL_FROM_ADDRESS:-voicemail@orbital.local}'
            # Voicemail webhook — externnotify script POSTs here
            # whenever Asterisk writes a new mailbox recording, so
            # Laravel can run transcription + send the rich email.
            VOICEMAIL_WEBHOOK_URL: '${VOICEMAIL_WEBHOOK_URL:-http://orbital.test/api/voicemail/received}'
            VOICEMAIL_WEBHOOK_TOKEN: '${VOICEMAIL_WEBHOOK_TOKEN:-change-me-in-env}'
        volumes:
            - './docker/asterisk/config:/etc/asterisk/generated:ro'
            # voicemail.conf is regenerated by AsteriskConfigService
            # whenever a tenant adds/removes a voicemail routing rule.
            # Bind-mount over the stock file so Laravel-owned mailbox
            # state wins; `voicemail reload` via AMI picks it up
            # without an Asterisk restart.
            - './docker/asterisk/config/voicemail.conf:/etc/asterisk/voicemail.conf:ro'
            - 'asterisk-spool:/var/spool/asterisk'
            - 'asterisk-recordings:/var/spool/asterisk/monitor'
            # Voicemail WAVs land here. Shared with the Laravel app
            # container so TranscribeVoicemailJob can read the file
            # directly from the spool path the externnotify script
            # hands it via webhook payload.
            - 'asterisk-voicemail-spool:/var/spool/asterisk/voicemail'
            # Disclosure-message TTS prompt files, written by the
            # Laravel app container (DisclosureRenderer) and played
            # back via dialplan Playback(...) at call time.
            #
            # HA note: in multi-node deployments this named volume is
            # replaced by a SeaweedFS FUSE mount so every Laravel and
            # Asterisk node sees the same files. The in-container path
            # stays identical — only the backing store changes.
            - 'asterisk-prompts:/var/spool/asterisk/prompts'
            # Shared TLS cert volume — Asterisk's entrypoint
            # symlinks /etc/tls/fullchain.pem → /etc/asterisk/keys/
            # when a managed cert exists, falling back to self-signed
            # generation when it doesn't.
            - 'tls-certs:/etc/tls:ro'
        networks:
            # Asterisk needs the `sail` network to reach pgsql for its
            # ARA realtime queries, plus `telephony` for the LiveKit /
            # Icecast / SIP-bridge peers.
            - sail
            - telephony
        cap_add:
            - NET_ADMIN
        restart: unless-stopped

    livekit:
        image: 'livekit/livekit-server:latest'
        ports:
            - '7880:7880'
            - '7881:7881'
            - '7882:7882/udp'
        command: --config /etc/livekit.yaml --bind 0.0.0.0
        volumes:
            - './docker/livekit/livekit.yaml:/etc/livekit.yaml:ro'
        networks:
            - telephony
        restart: unless-stopped

    livekit-sip:
        image: 'livekit/sip:latest'
        ports:
            - '5069:5069/udp'
            - '5069:5069/tcp'
        volumes:
            # The livekit-sip binary expects its config at /sip/config.yaml.
            - './docker/livekit/sip-config.yaml:/sip/config.yaml:ro'
        networks:
            - telephony
        depends_on:
            - livekit
        restart: unless-stopped

    agent-worker:
        build:
            context: ./docker/agent-worker
            dockerfile: Dockerfile
        volumes:
            - './agent-worker:/app'
        environment:
            LIVEKIT_URL: '${LIVEKIT_URL:-ws://livekit:7880}'
            LIVEKIT_API_KEY: '${LIVEKIT_API_KEY}'
            LIVEKIT_API_SECRET: '${LIVEKIT_API_SECRET}'
            ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY}'
            OPENAI_API_KEY: '${OPENAI_API_KEY}'
            ELEVENLABS_API_KEY: '${ELEVENLABS_API_KEY}'
            ELEVEN_API_KEY: '${ELEVENLABS_API_KEY}'
            OPENROUTER_API_KEY: '${OPENROUTER_API_KEY}'
            ORBITAL_API_URL: 'http://orbital.test/api'
            ORBITAL_API_TOKEN: '${AGENT_WORKER_TOKEN}'
        networks:
            - sail
            - telephony
        depends_on:
            - livekit
        restart: unless-stopped

    # Optional: self-hosted Icecast2 for hold-music streams. Asterisk talks
    # to it over the `telephony` network at http://icecast:8000/<mountpoint>.
    # You can also point Hold Music sources at any external Icecast/HTTP
    # audio stream and skip running this container — it's purely optional.
    #
    # Default admin password is in docker/icecast/icecast.xml — change it
    # before exposing this beyond your local docker network.
    icecast:
        image: 'moul/icecast:latest'
        # Bound to loopback only — the Icecast admin UI ships with
        # default passwords and Orbital doesn't have SSO in front
        # of it yet, so exposing 8000 on all interfaces leaks
        # stream sources + admin access to the LAN. Internal
        # container-to-container traffic still works via the
        # telephony network.
        ports:
            - '127.0.0.1:8000:8000'
        environment:
            ICECAST_SOURCE_PASSWORD: '${ICECAST_SOURCE_PASSWORD:-changeme}'
            ICECAST_ADMIN_PASSWORD: '${ICECAST_ADMIN_PASSWORD:-changeme}'
            ICECAST_PASSWORD: '${ICECAST_PASSWORD:-changeme}'
            ICECAST_RELAY_PASSWORD: '${ICECAST_RELAY_PASSWORD:-changeme}'
            ICECAST_HOSTNAME: 'icecast'
        volumes:
            - 'icecast-config:/etc/icecast'
        networks:
            - telephony
        restart: unless-stopped

    # ──────────────────────────────────────────────────────────────────
    # Observability stack: Prometheus (metrics), Loki (logs), Promtail
    # (log shipper), Grafana (UI). All four live on the `sail` network so
    # they can scrape/reach one another, and Grafana + Prometheus are
    # additionally exposed to the host for direct access.
    # ──────────────────────────────────────────────────────────────────

    prometheus:
        image: 'prom/prometheus:latest'
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.enable-lifecycle'
        # Bound to loopback only — Prometheus has no auth in front
        # of it, so exposing 9090 on all interfaces leaks the full
        # metrics surface (including tenant counts and request
        # histograms) to the LAN. Grafana still scrapes it over
        # the sail network by service name; the host-port binding
        # is only for developer click-through from the admin UI
        # on the same machine.
        ports:
            - '127.0.0.1:9090:9090'
        volumes:
            - './docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
            - 'sail-prometheus:/prometheus'
        networks:
            - sail
        restart: unless-stopped

    loki:
        image: 'grafana/loki:latest'
        # Run as root so Loki can mkdir subdirs inside the named volume on
        # first boot. Without this, the non-root loki user can't write to
        # /loki-data and the container crash-loops.
        user: '0'
        # -config.expand-env lets the config reference ${AWS_SECRET_ACCESS_KEY}
        # and pick up the S3 credentials at boot. Chunks/index live in the
        # SeaweedFS S3 bucket `loki-chunks`; both Loki nodes share the bucket.
        command: '-config.file=/etc/loki/local-config.yaml -config.expand-env=true'
        ports:
            - '3100:3100'
        environment:
            # Both vars in env so the AWS SDK default credential
            # chain resolves consistently; the config file also
            # references secret_access_key via -config.expand-env.
            AWS_ACCESS_KEY_ID: 'orbital'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY}'
        volumes:
            - './docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro'
            - 'sail-loki:/loki-data'
        networks:
            - sail
        restart: unless-stopped

    promtail:
        image: 'grafana/promtail:latest'
        command: '-config.file=/etc/promtail/config.yaml'
        volumes:
            - './docker/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro'
            - '/var/lib/docker/containers:/var/lib/docker/containers:ro'
            - '/var/run/docker.sock:/var/run/docker.sock'
        networks:
            - sail
        depends_on:
            - loki
        restart: unless-stopped

    # ──────────────────────────────────────────────────────────────────
    # SeaweedFS — S3-compatible object storage replacing MinIO.
    # We moved off MinIO because minio/minio was archived in Feb 2026
    # ("THIS REPOSITORY IS NO LONGER MAINTAINED"), Console features
    # were progressively stripped in mid-2025 as MinIO Inc. pushed
    # toward their commercial AIStor product, and the upgrade path
    # dried up. SeaweedFS is Apache 2.0, actively maintained, and has
    # a drop-in S3 gateway.
    #
    # Single-node setup uses `weed server` which runs master, volume,
    # filer, and the S3 gateway in one process. For prod/HA we'd split
    # master/volume into separate containers across nodes, but dev
    # doesn't need that complexity.
    #
    # Laravel talks to SeaweedFS exclusively through its S3 API on
    # port 8333, so the existing `s3` filesystem disk config works
    # unchanged — only AWS_ENDPOINT needs to move from
    # http://minio:9000 to http://seaweedfs:8333.
    #
    # `s3.json` defines a single identity with Admin/Read/Write/List/
    # Tagging actions, matching the MinIO root credentials the app
    # was already using so `.env` AWS_* vars don't need to rotate.
    # ──────────────────────────────────────────────────────────────────
    seaweedfs:
        image: 'chrislusf/seaweedfs:latest'
        # Entrypoint override: before starting `weed server`, write
        # the S3 identities config to /tmp/s3.json using the
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars. This
        # makes rotation a one-line `.env` edit instead of requiring
        # a file bind-mount that has to be kept in lockstep with
        # Laravel's credentials. Secrets never touch the git tree.
        #
        # $$ is the docker-compose escape for a single $ so shell
        # variable expansion runs inside the container, not at
        # compose parse time.
        entrypoint:
            - /bin/sh
            - -c
            - |
              cat > /tmp/s3.json <<EOF
              {
                  "identities": [
                      {
                          "name": "orbital",
                          "credentials": [
                              {
                                  "accessKey": "$${AWS_ACCESS_KEY_ID}",
                                  "secretKey": "$${AWS_SECRET_ACCESS_KEY}"
                              }
                          ],
                          "actions": ["Admin","Read","Write","List","Tagging"]
                      }
                  ]
              }
              EOF
              exec weed server \
                  -dir=/data \
                  -master.volumeSizeLimitMB=256 \
                  -volume.max=0 \
                  -filer=true \
                  -s3=true \
                  -s3.config=/tmp/s3.json \
                  -metricsPort=9324
        environment:
            AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID}'
            AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY}'
        # IMPORTANT SECURITY NOTE on port bindings:
        # SeaweedFS's filer web UI (8888) and master admin (9333)
        # ship with NO AUTHENTICATION in the community build, and
        # both accept write operations. Leaving them on 0.0.0.0
        # means any LAN peer (including the browser in a private
        # window on the same machine) can freely browse and modify
        # bucket contents, bypassing the S3 API's key-based auth
        # entirely. Both are bound to loopback only so only the
        # host machine can reach them, and Laravel/mc access them
        # inside the sail network via the `seaweedfs` service name
        # which still works through docker's internal DNS.
        #
        # The S3 gateway on 8333 is also loopback-bound as a
        # belt-and-suspenders measure — it's auth-gated by the
        # s3.json identity file, but there's no reason any LAN
        # peer should be probing it.
        ports:
            - '127.0.0.1:${FORWARD_S3_PORT:-9000}:8333'   # S3 API (auth'd via s3.json identities)
            - '127.0.0.1:${FORWARD_S3_FILER_PORT:-9001}:8888'  # Filer web UI (NO auth — loopback only)
            - '127.0.0.1:${FORWARD_S3_MASTER_PORT:-9333}:9333'  # Master admin (NO auth — loopback only)
        volumes:
            - 'sail-seaweedfs:/data'
        networks:
            - sail
        healthcheck:
            test: ['CMD-SHELL', 'wget -q -O - http://localhost:8333/status || exit 1']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        restart: unless-stopped

    # ──────────────────────────────────────────────────────────────────
    # Ollama — local embedding / inference server. Used by
    # EmbeddingService when services.embeddings.provider = ollama, and
    # by any future local-model path. Models are downloaded lazily on
    # first use and persisted to the sail-ollama volume so they don't
    # re-download across restarts.
    #
    # Pull a starter embedding model after the first boot:
    #   docker compose exec ollama ollama pull nomic-embed-text
    # ──────────────────────────────────────────────────────────────────
    ollama:
        image: 'ollama/ollama:latest'
        ports:
            - '${FORWARD_OLLAMA_PORT:-11434}:11434'
        volumes:
            - 'sail-ollama:/root/.ollama'
        networks:
            - sail
        restart: unless-stopped

    # Local whisper.cpp transcription service. Used by tenants that
    # select `whisper_local` as their voicemail transcription
    # provider — the TranscribeVoicemailJob POSTs WAVs here and
    # gets plain-text transcripts back. Offline-first: model files
    # are baked into the image at build time, no cloud dependency.
    #
    # WHISPER_MODELS is the comma-separated list of ggml models to
    # pre-download. Defaults cover fast/accurate English + two
    # multilingual options. Add `medium` or `large-v3` if a tenant
    # asks for higher accuracy and the host can afford the RAM.
    whisper-local:
        build:
            context: ./docker/whisper-local
            args:
                WHISPER_MODELS: '${WHISPER_MODELS:-tiny.en,base.en,small,large-v3-turbo}'
        networks:
            - sail
        restart: unless-stopped
        healthcheck:
            test: ['CMD', 'curl', '-fs', 'http://127.0.0.1:9700/']
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    grafana:
        image: 'grafana/grafana:latest'
        # Loopback binding only — the host port is kept as a
        # break-glass fallback but only reachable from the host
        # itself. All admin-panel traffic flows through Laravel's
        # /admin/grafana/* reverse-proxy route which injects
        # X-WEBAUTH-USER for auth-proxy mode. Binding to
        # 127.0.0.1 prevents the LAN from bypassing the proxy.
        ports:
            - '127.0.0.1:3000:3000'
        environment:
            GF_SECURITY_ADMIN_USER: '${GRAFANA_ADMIN_USER:-admin}'
            GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-admin}'
            GF_USERS_ALLOW_SIGN_UP: 'false'
            GF_ANALYTICS_REPORTING_ENABLED: 'false'
            GF_AUTH_ANONYMOUS_ENABLED: 'false'
            # Auth-proxy mode — Grafana trusts the X-WEBAUTH-USER
            # header on every request when the request originates
            # from the whitelisted network. Laravel's reverse
            # proxy sets the header to the signed-in user's email;
            # Grafana auto-creates a matching user on first visit
            # and assigns the default role from
            # GF_USERS_AUTO_ASSIGN_ORG_ROLE (Viewer, below).
            GF_AUTH_PROXY_ENABLED: 'true'
            GF_AUTH_PROXY_HEADER_NAME: 'X-WEBAUTH-USER'
            GF_AUTH_PROXY_HEADER_PROPERTY: 'username'
            GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
            GF_AUTH_PROXY_HEADERS: 'Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME'
            # Sail network CIDR (172.16.0.0/12 covers every docker
            # bridge Laravel will ever sit on) plus loopback for
            # the emergency host-port fallback. In prod this list
            # is replaced by an nginx/Traefik sidecar that
            # validates the X-Orbital-Proxy-Token header before
            # forwarding — the sail network trust is dev-only.
            GF_AUTH_PROXY_WHITELIST: '172.16.0.0/12,127.0.0.1'
            GF_USERS_AUTO_ASSIGN_ORG_ROLE: 'Viewer'
            # Serve-from-sub-path so Grafana's own generated URLs
            # (redirects, static assets, API calls) include the
            # /admin/grafana/ prefix and the browser keeps routing
            # through our Laravel proxy.
            GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/admin/grafana/'
            GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
            # Persistent state (dashboards, users, datasources,
            # alerts) lives in the clustered Postgres via HAProxy,
            # so Grafana becomes stateless — any node can serve any
            # request and kill-and-replace doesn't lose anything.
            GF_DATABASE_TYPE: 'postgres'
            GF_DATABASE_HOST: '${DB_HOST:-pgsql}:${DB_PORT:-5432}'
            GF_DATABASE_NAME: 'grafana'
            GF_DATABASE_USER: '${DB_USERNAME:-orbital}'
            GF_DATABASE_PASSWORD: '${DB_PASSWORD:-password}'
            GF_DATABASE_SSL_MODE: 'disable'
        volumes:
            - './docker/grafana/provisioning:/etc/grafana/provisioning:ro'
            - 'sail-grafana:/var/lib/grafana'
        networks:
            - sail
        depends_on:
            - prometheus
            - loki
        restart: unless-stopped

networks:
    sail:
        driver: bridge
    telephony:
        driver: bridge

volumes:
    sail-pgadmin:
        driver: local
    asterisk-spool:
        driver: local
    asterisk-recordings:
        driver: local
    asterisk-prompts:
        driver: local
    # Shared between asterisk-1, asterisk-2, and orbital.test. Asterisk
    # writes mailbox WAVs; Laravel reads them via TranscribeVoicemailJob.
    asterisk-voicemail-spool:
        driver: local
    icecast-config:
        driver: local
    sail-prometheus:
        driver: local
    sail-loki:
        driver: local
    sail-grafana:
        driver: local
    sail-seaweedfs:
        driver: local
    sail-ollama:
        driver: local
    tls-certs:
        driver: local
    acme-data:
        driver: local
    # Per-node recording-daemon spool. Each rtpengine writes its
    # paired `*-recv.wav` / `*-send.wav` files here; the upload
    # watcher reads them out and creates `call_recordings` rows.
    rtpengine-1-spool:
        driver: local
    rtpengine-2-spool:
        driver: local
