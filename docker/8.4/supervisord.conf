[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker for the default Redis queue. Without this,
; broadcast notifications sit in Valkey forever because
; Laravel's BroadcastNotificationCreated event implements
; ShouldBroadcast (not ShouldBroadcastNow), so every toast
; push goes through the queue. Running one worker per app
; container means the operator-panel drain toast arrives
; within a second of the drain action firing.
[program:queue]
command=php /var/www/html/artisan queue:work --tries=1 --sleep=1 --timeout=60
user=sail
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
