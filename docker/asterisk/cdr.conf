;
; cdr.conf — call detail records.
;
; Every call that reaches the dialplan gets a CDR, answered or not:
; missed calls, busy and failed calls matter for Call History and
; billing as much as answered ones. Calls PJSIP rejects before the
; dialplan (SIP scanners dialling numbers we don't route) never get a
; channel, so they never get a CDR.
;
; Records go to two backends:
;   - cdr_adaptive_odbc → the `asterisk_cdr` table in Postgres (see
;     cdr_adaptive_odbc.conf). This is the durable copy; Laravel's
;     orbital:ingest-cdrs turns those rows into Call History.
;   - cdr_csv → /var/log/asterisk/cdr-csv/Master.csv inside the pod,
;     handy for a quick look but lost when the pod restarts.
;
[general]
enable=yes
unanswered=yes
congestion=yes
batch=no
safeshutdown=yes

[csv]
usegmtime=yes
loguniqueid=yes
loguserfield=yes
accountlogs=no
