;
; cdr_adaptive_odbc.conf — write every CDR to Postgres.
;
; Uses the same `orbital` ODBC connection as realtime (res_odbc.conf).
; Columns are matched to CDR variables by name when the module loads,
; so the table (migration create_asterisk_cdr_table) must exist first:
; Helm runs migrations before the Asterisk pods roll, and the
; config-sync sidecar reloads this module with every dialplan reload
; as a safety net.
;
; Besides the standard fields, the dialplan sets orbital_* CDR
; variables (client, routing rule, DID, inbound SIP Call-ID); columns
; of the same name pick them up.
;
; start/answer/end are aliased: `end` is reserved in SQL.
;
[orbital]
connection=orbital
table=asterisk_cdr
usegmtime=yes
alias start => started_at
alias answer => answered_at
alias end => ended_at
