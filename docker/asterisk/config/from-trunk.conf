[from-trunk]

; Rule 1: Demo Customer main inbound → tenant_2
exten => _X.,1,NoOp(Inbound _X. for tenant 2 via rule 1)
 same => n,Goto(tenant_2,queue-1,1)
 same => n,Hangup()

; Rule 2: Voicemail on inbound 15550000001 → tenant_4
exten => 15550000001,1,NoOp(Inbound 15550000001 for tenant 4 via rule 2)
 same => n,Answer()
 same => n,VoiceMail(900001@default)
 same => n,Hangup()

; Rule 3: Inbound 15550000002 → operator queue → tenant_5
exten => 15550000002,1,NoOp(Inbound 15550000002 for tenant 5 via rule 3)
 same => n,Goto(tenant_5,queue-2,1)
 same => n,Hangup()

; Rule 4: Inbound 15550000003 → queue (AI on overflow) → tenant_6
exten => 15550000003,1,NoOp(Inbound 15550000003 for tenant 6 via rule 4)
 same => n,Goto(tenant_6,queue-3,1)
 same => n,Hangup()


; Catch-all — any DID with no matching rule gets a clean hangup so
; SIP scanners can't trigger billing-loud loops.
exten => _X.,1,NoOp(Unmatched inbound DID ${EXTEN})
 same => n,Hangup()


[from-livekit]

; Calls returning from the LiveKit AI agent leg dial back here with
; the original tenant extension as ${EXTEN}. Until Phase 4 lands the
; ARA endpoint naming (t{team_id}_{number}), this stays a flat
; fallback — when a LiveKit return needs to land in a per-tenant
; context the worker should send the prefixed name.
exten => _X.,1,NoOp(From LiveKit: ${EXTEN})
 same => n,Goto(default,${EXTEN},1)
