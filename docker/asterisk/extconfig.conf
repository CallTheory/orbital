;
; extconfig.conf — maps Asterisk config families to ODBC tables.
;
; The format is `family => engine,connection[,table]`. When a
; module asks Asterisk's config layer for "ps_endpoints", the
; realtime backend redirects the lookup to the `orbital` ODBC
; connection (defined in res_odbc.conf) and selects from the table
; named `ps_endpoints`. Combined with sorcery.conf below, this is
; what makes pjsip pull endpoints from Postgres on call setup
; instead of from a static .conf file.
;
; The `queues` and `queue_log` lines do the same for the queue
; engine (app_queue) — queue definitions, member rosters, and event
; logging all live in tables Asterisk pulls per-call. No
; regen-and-reload pipeline is required for anything declared here.
;
[settings]

; ── pjsip realtime ──────────────────────────────────────────────
ps_endpoints => odbc,orbital
ps_auths => odbc,orbital
ps_aors => odbc,orbital
ps_endpoint_id_ips => odbc,orbital
ps_contacts => odbc,orbital

; ── app_queue realtime ──────────────────────────────────────────
queues => odbc,orbital,queues
queue_members => odbc,orbital,queue_members
queue_log => odbc,orbital,queue_log
