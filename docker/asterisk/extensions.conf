;
; extensions.conf — dialplan base.
;
; The real routing is generated by App\Services\Telephony\AsteriskConfigService
; into per-tenant include files under /etc/asterisk/generated/tenants/
; with a top-level `dialplan_index.conf` enumerating them and a
; `from-trunk.conf` holding the inbound dispatcher. This baked base
; provides the [general] / [globals] / [default] / [hooks-beep]
; pieces so the container boots cleanly even before the Laravel
; generator has run (the #tryinclude is silent on missing files).
;

[general]
static = yes
writeprotect = no
clearglobalvars = no
autofallthrough = yes

[globals]

; ─── fallback context ────────────────────────────────────────────────
; Applies to any call that lands here before the generated dialplan
; has been written. Explicitly hangs up rather than 404'ing so SIP
; scanners don't trigger alarmingly-large CDRs.
[default]
exten => _X.,1,NoOp(Unhandled call to ${EXTEN} — no dialplan generated yet)
 same => n,Hangup()

; ─── hooks-beep ──────────────────────────────────────────────────────
; Dialplan subroutine invoked by PERIODIC_HOOK() in the mix-monitor
; partial. Plays a short 1 kHz tone into the active channel every
; N seconds while a call is being recorded — the audible notification
; some jurisdictions require throughout the recording. Uses PlayTones
; rather than a sound file so nothing has to be pre-installed into
; the Asterisk image.
[hooks-beep]
exten => beep,1,NoOp(Recording notification beep)
 same => n,PlayTones(!1000/150)
 same => n,Wait(0.2)
 same => n,StopPlayTones()
 same => n,Return()

#tryinclude "generated/dialplan_index.conf"
