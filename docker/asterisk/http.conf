;
; http.conf — Asterisk HTTP/HTTPS server.
;
; Provides the TLS socket that res_http_websocket uses for the
; `transport-wss` pjsip transport (WebRTC signaling on 8089). Without
; this file, the wss transport declared in pjsip.conf has no actual
; listener and WebRTC clients can't connect.
;
; Plain HTTP on 8088 is kept localhost-only (not exposed through
; docker-compose) for ARI and status endpoints used by the Laravel
; integration. Public traffic always goes through 8089/TLS.
;

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
prefix = asterisk
sessionlimit = 100
session_inactivity = 30000
session_keep_alive = 15000

; TLS listener for WSS and any HTTPS ARI calls.
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/asterisk.pem
tlsprivatekey = /etc/asterisk/keys/asterisk.key
