;
; logger.conf — Asterisk logging config.
;
; The interesting bit for Orbital is `queue_log_to_file = no` +
; `queue_log_realtime = yes`, which tells app_queue to write every
; queue event (ENTERQUEUE, ABANDON, COMPLETEAGENT, etc.) directly
; to the realtime `queue_log` family — i.e. the `queue_log` table
; in Postgres via the ODBC connection wired up in extconfig.conf.
;
; That replaces the traditional `queue_log` flat-file at
; /var/log/asterisk/queue_log with a structured table the
; orbital:roll-up-queue-metrics command can aggregate without log
; tailing.
;
[general]
dateformat = %F %T.%3q
queue_log = yes
queue_log_to_file = no
queue_log_realtime = yes
queue_log_name = queue_log

[logfiles]
; Keep the standard Asterisk log files going to disk; we're only
; redirecting the queue log.
console = notice,warning,error
messages = notice,warning,error
full = notice,warning,error,debug,verbose
