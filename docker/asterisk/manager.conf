;
; Asterisk Manager Interface (AMI) configuration.
;
; Baked into the image so AMI is always available on port 5038 regardless of
; whether the Laravel config generator has written anything to
; /etc/asterisk/generated. The Orbital app connects here from
; orbital.test:5038 using the ORBITAL_AMI_* env vars.
;
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no
webenabled = no
brokeneventsaction = yes
allowmultiplelogin = yes

[orbital]
secret = 34bf07c4eedb1b4a471dd899a0692ce98e4ca59f0c8128c2
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan
write = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan,originate
