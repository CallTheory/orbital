;
; DSN template. Copied into the image as /etc/odbc.ini.tmpl and
; envsubst'd into /etc/odbc.ini at container start by the
; entrypoint script. Placeholders are filled from docker-compose's
; environment block which mirrors Laravel's .env.
;
; The DSN name `orbital-realtime` is referenced by res_odbc.conf —
; if you rename it here, rename it there too.
;
[orbital-realtime]
Description = Orbital realtime backend
Driver = PostgreSQL
Servername = ${DB_HOST}
Port = ${DB_PORT}
Database = ${DB_DATABASE}
Username = ${DB_USERNAME}
Password = ${DB_PASSWORD}
Protocol = 7.4+
ReadOnly = No
RowVersioning = No
ShowSystemTables = No
ShowOidColumn = No
FakeOidIndex = No
ConnSettings =
