;
; ODBC driver registry. Tells unixODBC where to find the
; PostgreSQL ODBC driver shared object. Without this, attempting
; to connect via the `psqlodbc` driver name fails with "data source
; name not found and no default driver specified".
;
; The path is the standard install location for the Debian
; `odbc-postgresql` package. Copied to /etc/odbcinst.ini in the
; runtime stage of the Asterisk Dockerfile.
;
[PostgreSQL]
Description = PostgreSQL ODBC driver (Unicode)
Driver = /usr/lib/x86_64-linux-gnu/odbc/psqlodbcw.so
Setup = /usr/lib/x86_64-linux-gnu/odbc/libodbcpsqlS.so
Debug = 0
CommLog = 0
UsageCount = 1
