;
; pjsip.conf — Orbital baked base.
;
; Holds the four SIP transports Orbital expects every install to have:
;
;   - UDP 5060   standard SIP
;   - TCP 5060   SIP over TCP (same port, different protocol)
;   - TLS 5061   standard SIP over TLS
;   - WSS 8089   WebRTC WebSocket (binds to Asterisk's HTTP TLS server;
;                see http.conf for the actual listener)
;
; Transports live here — in a file baked into the image — instead of in
; the Laravel-generated pjsip_generated.conf because they're
; infrastructure, not tenant data. Transports must exist on first boot
; for the container to be functional; endpoints and trunks (written by
; App\Services\Telephony\AsteriskConfigService) come in via the
; #tryinclude at the bottom of this file.
;

[global]
type = global
user_agent = Orbital PBX
debug = no
keep_alive_interval = 90

;---------------------------------------------------------------------
; Transports
;---------------------------------------------------------------------

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
allow_reload = yes
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 127.0.0.0/8

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
allow_reload = yes
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 127.0.0.0/8

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
cert_file = /etc/asterisk/keys/asterisk.pem
priv_key_file = /etc/asterisk/keys/asterisk.key
method = tlsv1_2
verify_client = no
verify_server = no
allow_reload = yes
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
local_net = 127.0.0.0/8

[transport-wss]
type = transport
protocol = wss
; The actual socket lives in http.conf (tlsbindaddr=0.0.0.0:8089).
; pjsip still requires a `bind` declaration to register the transport,
; and it must match the http.conf listener or Asterisk refuses to
; start the transport ("binding not specified").
bind = 0.0.0.0:8089
allow_reload = yes

;---------------------------------------------------------------------
; Tenant-owned endpoints, trunks, AORs
;
; Written by the Laravel generator into /etc/asterisk/generated/
; (mounted read-only from the host). #tryinclude so the container
; still boots cleanly when the directory is empty (fresh install,
; generator hasn't run yet).
;---------------------------------------------------------------------
#tryinclude "generated/pjsip_generated.conf"

; LiveKit SIP bridge trunk — static endpoint pointing at
; the livekit-sip container for AI agent calls.
#tryinclude "pjsip_livekit.conf"

; Note: sorcery.conf configures pjsip objects as realtime-only.
; Any infrastructure endpoints that would otherwise belong here
; (Kamailio dispatcher probe responder, etc.) must be seeded into
; Postgres via a migration instead — see the `anonymous` endpoint
; row seeded by the telephony bootstrap, which swallows unmatched
; OPTIONS probes so Kamailio dispatcher pings don't spam the log.
