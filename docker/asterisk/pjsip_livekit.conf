; ──────────────────────────────────────────────────────
; LiveKit SIP Bridge endpoint
;
; Asterisk routes AI agent calls to PJSIP/{ext}@livekit
; which sends them to the LiveKit SIP bridge container.
; The bridge creates a LiveKit room and dispatches the
; call to the Python agent worker.
;
; Static config — not managed by Laravel's ARA syncer.
; ──────────────────────────────────────────────────────

[livekit]
type=endpoint
transport=transport-udp
context=from-livekit
disallow=all
allow=ulaw
allow=alaw
allow=opus
aors=livekit
direct_media=no
rtp_symmetric=yes

[livekit]
type=aor
contact=sip:livekit-sip:5069

[livekit]
type=identify
endpoint=livekit
match=livekit-sip
