;
; res_odbc.conf — Asterisk's ODBC connection pool wireup.
;
; Every realtime family (ps_endpoints, ps_auths, ps_aors, queues,
; queue_log, etc — see extconfig.conf) ultimately goes through one
; of these named connections to reach Postgres. The connection
; below is named `orbital`; extconfig refers to it by that name.
;
; The DSN `orbital-realtime` is defined in /etc/odbc.ini at the
; system level (see docker/asterisk/odbc.ini), backed by the
; PostgreSQL ODBC driver registered in /etc/odbcinst.ini. Asterisk
; doesn't talk to Postgres directly — it talks to unixODBC, which
; loads the driver, which talks to Postgres.
;
; Username + password come from /etc/odbc.ini's [orbital-realtime]
; section, which the entrypoint envsubst's at boot from the DB_*
; env vars. Asterisk's res_odbc respects DSN-level credentials
; when none are set here.
;
; Setting username/password directly in this file would require
; Asterisk to do its own variable substitution on conf files —
; which it doesn't — and we'd end up shipping literal
; `${DB_USERNAME}` strings to Postgres at connect time.
;
[orbital]
enabled => yes
dsn => orbital-realtime
pre-connect => yes
sanitysql => select 1
max_connections => 5
forcecommit => no
isolation => read_committed
