;
; rtp.conf — UDP media port range.
;
; Pinned to 10000–10099 to match docker-compose.yml's port mapping so
; NAT/host networking works out of the box. Keeping the window small
; avoids opening thousands of unused UDP ports on the host; 100
; concurrent calls is plenty for dev and small installs. Scale the
; range in both this file and docker-compose.yml when more simultaneous
; calls are needed.
;

[general]
rtpstart = 10000
rtpend = 10099
strictrtp = yes
probation = 4
icesupport = yes
