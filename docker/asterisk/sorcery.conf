;
; sorcery.conf — pjsip object backend selection.
;
; Sorcery is the abstraction layer pjsip uses to load endpoints,
; auths, aors, identifies, and contacts. By default it reads from
; static config files (res_sorcery_config); we tell it to read from
; the realtime backend (res_sorcery_realtime → res_config_odbc →
; orbital ODBC pool → Postgres) instead. The result: pjsip pulls
; every endpoint per-call from the ps_endpoints / ps_auths / ps_aors
; tables, and editing those tables takes effect on the next call
; with no Asterisk reload required.
;
; Sorcery wizard syntax: `<object_type> = <wizard>,<wizard_args>`.
; For the realtime wizard, the arg is the *realtime family name*
; (which extconfig.conf maps to an ODBC table). Multiple wizards
; are space-separated when you want a fallback chain — e.g.
; `endpoint = realtime,ps_endpoints config` would read realtime
; first and fall back to static config. We don't ship any static
; pjsip endpoint config (the baked pjsip.conf has only transports,
; not endpoints), so realtime alone is all we need.
;
[res_pjsip]
endpoint = realtime,ps_endpoints
auth = realtime,ps_auths
aor = realtime,ps_aors
identify = realtime,ps_endpoint_id_ips
contact = realtime,ps_contacts
