; Settings for the custom orbital-webhook plugin.
;
; The plugin reads env vars at startup (ORBITAL_WEBHOOK_URL,
; ORBITAL_WEBHOOK_TOKEN) so docker-compose can inject them per
; environment without rebuilding the image. This file holds the
; values that DON'T change between environments.

; HTTP timeout in milliseconds for the POST to Laravel. Laravel's
; controller does the absolute minimum (save raw to MinIO + dispatch
; a queue job) so it should respond in well under a second even on
; a cold container. A 10s ceiling leaves headroom for MinIO hiccups
; without making senders wait forever.
timeout = 10000

; On non-2xx responses, how Haraka responds to the sender:
;   - denysoft: 4xx temporary failure, sender retries
;   - denyhard: 5xx permanent failure, sender gives up
; Always denysoft for transient Laravel/MinIO errors — we want
; retries to recover any message we temporarily fail to accept.
on_error = denysoft
