; Haraka SMTP listener config.
;
; Bind on all interfaces inside the container so the host port
; mapping works. In production we'd bind to the container network
; interface specifically, but for docker-compose dev this is fine.
;
; Single-node single-worker setup: Haraka's purpose here is just
; SMTP → HTTP translation, not high-volume mail delivery. One
; worker is plenty for any realistic inbound rate, and it keeps
; logs linear and debuggable.

listen = [::0]:25
public_ip = 0.0.0.0

; Max message size: 25 MB. Larger than most legitimate mail;
; anything bigger is probably an attachment flood or a mis-sent
; backup. Laravel's webhook has its own upload limit and will
; reject if this is exceeded.
max_size = 26214400

; One Haraka worker is enough — our mail volume is modest and
; bursts get absorbed by the Laravel `inbound-mail` queue, not
; by scaling Haraka itself.
nodes = 1

; No TLS in dev — the only thing talking to Haraka is either
; localhost (swaks for testing) or a trusted upstream relay.
; Production TLS config lands when we expose Haraka to the
; public internet, which is a later phase.
