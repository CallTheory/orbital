#!KAMAILIO
#
# Orbital — Kamailio SIP proxy configuration (Phase 0).
#
# Sits between external SIP trunks and Asterisk. All inbound SIP
# signaling enters here; Kamailio dispatches it to Asterisk on the
# internal docker `telephony` network. Provides call draining for
# maintenance: the admin UI marks the Asterisk backend as "inactive"
# via JSON-RPC, Kamailio stops sending new calls but lets existing
# dialogs complete naturally, the operator restarts Asterisk only
# after active calls reach zero.
#
# What does NOT go through Kamailio:
#   - Operator softphone WebRTC (WSS 8089 → Asterisk directly)
#   - LiveKit SIP bridge (5069 → Asterisk directly)
#   - RTP media (10000-10099 → Asterisk directly, signaling-only proxy)
#   - Outbound trunk registrations (Asterisk → provider directly)
#

####### Global Parameters #######

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

fork=yes
children=4

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

# Management HTTP listener for the JSON-RPC endpoint at /jsonrpc.
# Laravel's KamailioService posts drain/activate/status commands here.
listen=tcp:0.0.0.0:8090 advertise 0.0.0.0:8090

auto_aliases=no
dns=no
rev_dns=no

# Required for xhttp module to receive HTTP requests.
tcp_accept_no_cl=yes

####### Module Loading #######

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "dispatcher.so"
loadmodule "dialog.so"
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
loadmodule "pv.so"
loadmodule "kex.so"
loadmodule "xlog.so"

####### Module Parameters #######

# --- Transaction Module ---
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)

# --- Record-Route ---
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# --- Dispatcher (backend load balancer) ---
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
# Probe backends with SIP OPTIONS every 30s so the health card
# and dispatcher.list RPC reflect real-time reachability.
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=401;code=403;code=404;code=405")
# flags=2 enables failover to next backend on failure — only
# meaningful in Phase 1 with multiple backends, but harmless
# to set now and one less config change later.
modparam("dispatcher", "flags", 2)

# --- Dialog (active call tracking for drain monitoring) ---
# Every INVITE that has flag 4 set gets dialog-tracked.
# dlg.stats_active returns the count of in-progress calls —
# the key metric the admin UI watches during drain.
modparam("dialog", "dlg_flag", 4)
modparam("dialog", "track_cseq_updates", 1)

# --- JSON-RPC over HTTP ---
# The jsonrpcs module handles the RPC dispatch; xhttp module
# provides the HTTP listener. Requests to /jsonrpc on port 8090
# are routed to jsonrpc_dispatch() via event_route[xhttp:request].
modparam("jsonrpcs", "transport", 1)

####### Routing Logic #######

request_route {
    # --- Sanity checks ---
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Record-route so mid-dialog requests (re-INVITE, BYE)
    # come back through us. Without this, the callee would
    # send BYE directly to the caller's Contact, bypassing
    # Kamailio and breaking dialog tracking.
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # --- Sequential (in-dialog) requests ---
    # These already have a Route header from our record_route
    # above. Just follow the route and relay.
    if (has_totag()) {
        if (loose_route()) {
            # Dialog module auto-decrements active call count on
            # BYE — no explicit handling needed here.
            t_relay();
            exit;
        }
        # In-dialog request without a matching route — reject.
        sl_send_reply("404", "Not Here");
        exit;
    }

    # --- CANCEL ---
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # --- Initial INVITE ---
    if (is_method("INVITE")) {
        # Set dialog tracking flag so the dialog module counts
        # this call. The admin UI reads dlg.stats_active to
        # show "X active calls remaining" during drain.
        setflag(4);

        # Select a backend from dispatcher set 1.
        # Algorithm 0 = hash over Call-ID (sticky per-dialog).
        # With one backend this is irrelevant; with multiple
        # it keeps re-INVITEs on the same node.
        if (!ds_select_dst("1", "0")) {
            sl_send_reply("503", "Service Unavailable");
            exit;
        }

        t_on_failure("DISPATCH_FAIL");
        t_relay();
        exit;
    }

    # --- REGISTER ---
    # Proxy inbound registrations to Asterisk. Asterisk handles
    # the actual auth (digest) and contact binding. Outbound
    # registrations from Asterisk to providers bypass Kamailio
    # entirely — they go over the telephony network directly.
    if (is_method("REGISTER")) {
        if (!ds_select_dst("1", "0")) {
            sl_send_reply("503", "Service Unavailable");
            exit;
        }
        t_relay();
        exit;
    }

    # --- Everything else (OPTIONS, INFO, NOTIFY, etc.) ---
    if (!ds_select_dst("1", "0")) {
        sl_send_reply("503", "Service Unavailable");
        exit;
    }
    t_relay();
    exit;
}

# --- Failure route ---
# With a single backend (Phase 0), failure just means Asterisk
# is unreachable. Return 503 so the trunk provider can retry or
# route elsewhere if they have failover configured on their side.
# Phase 1 with multiple backends would try ds_next_dst() here.
failure_route[DISPATCH_FAIL] {
    if (t_is_canceled()) {
        exit;
    }
    xlog("L_WARN", "DISPATCH_FAIL: backend unreachable for $ru\n");
    t_reply("503", "Service Unavailable");
}

# --- HTTP management endpoint ---
# Routes HTTP requests on port 8090 to the jsonrpcs handler.
# The admin UI's KamailioService posts JSON-RPC 2.0 payloads
# here to read dispatcher state and control drain/activate.
event_route[xhttp:request] {
    if ($hu =~ "^/jsonrpc") {
        jsonrpc_dispatch();
        exit;
    }
    xhttp_reply("404", "Not Found", "text/plain", "Only /jsonrpc is served here.\n");
    exit;
}
