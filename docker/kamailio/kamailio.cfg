#!KAMAILIO
#
# Orbital — Kamailio SIP proxy configuration (Phase 0).
#
# Sits between external SIP trunks and Asterisk. All inbound SIP
# signaling enters here; Kamailio dispatches it to Asterisk on the
# internal docker `telephony` network. Provides call draining for
# maintenance: the admin UI marks the Asterisk backend as "inactive"
# via JSON-RPC, Kamailio stops sending new calls but lets existing
# dialogs complete naturally, the operator restarts Asterisk only
# after active calls reach zero.
#
# Phase 1b: operator softphone WSS terminates on Kamailio (7443) too,
# so all SIP signaling — external trunks, internal extensions,
# softphones — converges on a single edge plane. RTP relay still
# runs on rtpengine via the rtpengine.so module hook in route[RELAY].
#
# What does NOT go through Kamailio:
#   - LiveKit SIP bridge (5069 → Asterisk directly)
#   - Outbound trunk registrations (legacy; OutboundTrunkAuditor
#     surfaces these so admins can migrate them through Kamailio)
#

####### Global Parameters #######

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

fork=yes
children=4

# Required to bind any `listen=tls:` line below — without it the
# TLS-aware listeners are silently skipped at config-parse time
# (kamailio prints no error — the lines just don't show up in the
# final "Listening on" output and ports don't open).
enable_tls=yes

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
# DMQ peer-to-peer transport. Active/active Kamailio nodes peer
# over this socket (Phase 3); single-node dev keeps it bound but
# silent.
listen=udp:0.0.0.0:5090
# SIP TLS listener (5061) for trunks that prefer TLS over UDP/TCP.
listen=tls:0.0.0.0:5061
# WSS listener for operator softphones (Phase 1b). SipJS in the
# operator panel connects here over wss://sip-edge:7443/ — same
# cert as 5061. Operators were on Asterisk's WSS 8089 in Phase 0;
# moving them here lets rtpengine see operator-to-operator audio
# (which Asterisk's local WSS bypassed).
listen=tls:0.0.0.0:7443

# Management HTTP listener for the JSON-RPC endpoint at /jsonrpc.
# Laravel's KamailioService posts drain/activate/status commands here.
listen=tcp:0.0.0.0:8090 advertise 0.0.0.0:8090

auto_aliases=no
dns=no
rev_dns=no

# Required for xhttp module to receive HTTP requests.
tcp_accept_no_cl=yes

####### Module Loading #######

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "dispatcher.so"
loadmodule "dialog.so"
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
loadmodule "pv.so"
loadmodule "kex.so"
loadmodule "xlog.so"
# rtpengine — every SIP dialog has its media plane force-relayed
# through one of the registered rtpengine nodes. Kamailio talks to
# them over the NG control protocol (bencode-over-UDP). With two
# sockets configured, the rtpengine module load-balances across
# them; if one is down the other still serves.
loadmodule "rtpengine.so"
# DMQ — Distributed Message Queue. When the ha-telephony overlay
# is up, kamailio-1 and kamailio-2 peer over DMQ to keep dialog
# + dispatcher state in sync. Without a peer (single-node dev),
# DMQ silently does nothing — `notification_address` lists hosts
# that won't resolve, and the module just logs a warning per
# unresolved peer (cheap, not an outage). Phase 3's load-bearing
# guarantee for the SIP plane is exactly this: state survives a
# kamailio-1 restart because kamailio-2 has the dialogs.
loadmodule "dmq.so"
loadmodule "dmq_usrloc.so"
# TLS termination for the SIP TLS listener (5061) and the WSS
# listener (7443) that operator softphones connect to. Cert chain
# lives on the shared `tls-certs` Docker volume; the tls.cfg points
# at the same paths every other consumer (nginx-tls, Asterisk)
# reads. Rotation is driven by acme.sh deploy-hook → Laravel webhook
# → KamailioService::reloadTls() over JSON-RPC.
loadmodule "tls.so"
# WebSocket transport for SipJS operator softphones connecting
# over WSS. Pairs with `listen=tls:0.0.0.0:7443` above.
loadmodule "websocket.so"

####### Module Parameters #######

# --- Transaction Module ---
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 30000)

# --- Record-Route ---
modparam("rr", "enable_full_lr", 1)
modparam("rr", "append_fromtag", 1)

# --- Dispatcher (backend load balancer) ---
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
# Probe backends with SIP OPTIONS every 30s so the health card
# and dispatcher.list RPC reflect real-time reachability.
modparam("dispatcher", "ds_ping_interval", 30)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=401;code=403;code=404;code=405")
# flags=2 enables failover to next backend on failure — only
# meaningful in Phase 1 with multiple backends, but harmless
# to set now and one less config change later.
modparam("dispatcher", "flags", 2)

# --- Dialog (active call tracking for drain monitoring) ---
# Every INVITE that has flag 4 set gets dialog-tracked.
# dlg.stats_active returns the count of in-progress calls —
# the key metric the admin UI watches during drain.
modparam("dialog", "dlg_flag", 4)
modparam("dialog", "track_cseq_updates", 1)

# --- JSON-RPC over HTTP ---
# The jsonrpcs module handles the RPC dispatch; xhttp module
# provides the HTTP listener. Requests to /jsonrpc on port 8090
# are routed to jsonrpc_dispatch() via event_route[xhttp:request].
modparam("jsonrpcs", "transport", 1)

# rtpengine NG control sockets, comma-separated list. The module
# round-robins across them with a setid (`0` = default set). Both
# rtpengine containers listen on 22222/udp on the telephony Docker
# network — same shape we'd use on real edge VMs once Phase 3
# brings shared Valkey state online.
modparam("rtpengine", "rtpengine_sock", "udp:rtpengine-1:22222 udp:rtpengine-2:22222")
# Force ICE removal + RTCP mux + force-relay so every dialog goes
# through rtpengine even when both endpoints could theoretically
# talk peer-to-peer. Phase 1a's recording surface depends on this:
# if any dialog skips rtpengine, that call is silently un-recorded.
modparam("rtpengine", "extra_id_pv", "$avp(rtpengine_extra)")

# --- DMQ (active/active state sync) ---
# `server_address` = where THIS node listens for DMQ peer traffic.
# `notification_address` = where to announce ourselves. Phase 3
# pairs kamailio-1 with kamailio-2 over the telephony Docker
# network; on real VMs this becomes the inter-node SIP-over-VPC
# address. 5090 is the conventional DMQ port (off-band from SIP's
# 5060 so DMQ traffic doesn't get parsed as user signaling).
modparam("dmq", "server_address", "sip:0.0.0.0:5090")
modparam("dmq", "notification_address", "sip:kamailio:5090")
modparam("dmq", "multi_notify", 1)
modparam("dmq", "num_workers", 2)
# Dialog state DMQ replication ships separately in Kamailio 5.5.x
# (the integrated `dmq_replication` flag landed in 5.6+). For now
# usrloc-via-DMQ keeps SIP registrations in sync across nodes; full
# dialog replication waits for a Kamailio image bump.

# TLS profile path. Points at the cert chain on the shared
# `tls-certs` volume mounted into the kamailio container at
# /etc/tls/. Phase 1b's operator-WSS migration uses the same cert
# every other public-facing service (nginx-tls, Asterisk)
# already trusts.
modparam("tls", "config", "/etc/kamailio/tls.cfg")
# WebSocket module — keep idle connections alive (operator
# browsers close inactive sockets aggressively in some envs)
# and cap message size at the SIP-over-WSS spec ceiling.
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 30)

####### Routing Logic #######

request_route {
    # --- Sanity checks ---
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Record-route so mid-dialog requests (re-INVITE, BYE)
    # come back through us. Without this, the callee would
    # send BYE directly to the caller's Contact, bypassing
    # Kamailio and breaking dialog tracking.
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # --- Sequential (in-dialog) requests ---
    # These already have a Route header from our record_route
    # above. Just follow the route and relay.
    if (has_totag()) {
        if (loose_route()) {
            # Dialog module auto-decrements active call count on
            # BYE — no explicit handling needed here.
            #
            # rtpengine cleanup on BYE: tell rtpengine to release the
            # relay slot for this Call-ID. Without this we'd leak
            # active sessions on the rtpengine side until its delete-
            # delay expires. Also stops the recording-daemon for this
            # dialog, finalizing the WAV files for the upload watcher.
            if (is_method("BYE")) {
                rtpengine_delete();
            }
            t_relay();
            exit;
        }
        # In-dialog request without a matching route — reject.
        sl_send_reply("404", "Not Here");
        exit;
    }

    # --- CANCEL ---
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # --- Initial INVITE ---
    if (is_method("INVITE")) {
        # Set dialog tracking flag so the dialog module counts
        # this call. The admin UI reads dlg.stats_active to
        # show "X active calls remaining" during drain.
        setflag(4);

        # OUTBOUND TRUNK PATH —
        # An INVITE whose source matches an Asterisk node in
        # dispatcher set 1 is, by definition, a call going OUT
        # to a carrier (Asterisk routes outbound traffic through
        # us via PJSIP `outbound_proxy=sip:kamailio:5060;lr`).
        # We just relay to whatever R-URI says — that's the
        # carrier address Asterisk put there — but force RTP
        # through rtpengine first so the call is recorded the
        # same way every other dialog is.
        if (ds_is_from_list("1")) {
            rtpengine_manage("force trust-address replace-origin replace-session-connection ICE=remove");
            t_on_reply("RTPENGINE_REPLY");
            t_relay();
            exit;
        }

        # rtpengine offer — rewrite the SDP body so all RTP flows
        # through the edge instead of peer-to-peer. `force` makes
        # this unconditional (don't try to negotiate around it
        # based on endpoint capabilities), `trust-address` accepts
        # the source address rtpengine sees (no NAT detection
        # heuristics — the dispatcher hop already cleaned that up),
        # `replace-origin` + `replace-session-connection` rewrite
        # the SDP `o=` and `c=` lines to advertise rtpengine's IP
        # so the answering side sends RTP to us, and `ICE=remove`
        # strips ICE candidates the endpoint may have offered
        # (we're providing the ICE story for them).
        rtpengine_manage("force trust-address replace-origin replace-session-connection ICE=remove");

        # Mark this transaction so onreply_route knows to call
        # rtpengine_manage() on the answer SDP too.
        t_on_reply("RTPENGINE_REPLY");

        # Select a backend from dispatcher set 1.
        # Algorithm 0 = hash over Call-ID (sticky per-dialog).
        # With one backend this is irrelevant; with multiple
        # it keeps re-INVITEs on the same node.
        if (!ds_select_dst("1", "0")) {
            sl_send_reply("503", "Service Unavailable");
            exit;
        }

        t_on_failure("DISPATCH_FAIL");
        t_relay();
        exit;
    }

    # --- REGISTER ---
    # Proxy inbound registrations to Asterisk. Asterisk handles
    # the actual auth (digest) and contact binding. Outbound
    # registrations from Asterisk to providers bypass Kamailio
    # entirely — they go over the telephony network directly.
    if (is_method("REGISTER")) {
        if (!ds_select_dst("1", "0")) {
            sl_send_reply("503", "Service Unavailable");
            exit;
        }
        t_relay();
        exit;
    }

    # --- Everything else (OPTIONS, INFO, NOTIFY, etc.) ---
    if (!ds_select_dst("1", "0")) {
        sl_send_reply("503", "Service Unavailable");
        exit;
    }
    t_relay();
    exit;
}

# --- Failure route ---
# With a single backend (Phase 0), failure just means Asterisk
# is unreachable. Return 503 so the trunk provider can retry or
# route elsewhere if they have failover configured on their side.
# Phase 1 with multiple backends would try ds_next_dst() here.
failure_route[DISPATCH_FAIL] {
    if (t_is_canceled()) {
        exit;
    }
    # Release the rtpengine slot we reserved during request routing
    # — without this we'd leak the relay until delete-delay fires.
    rtpengine_delete();
    xlog("L_WARN", "DISPATCH_FAIL: backend unreachable for $ru\n");
    t_reply("503", "Service Unavailable");
}

# --- rtpengine reply route ---
# Called on every provisional + final response to a transaction
# the request-route flagged with `t_on_reply("RTPENGINE_REPLY")`.
# Rewriting the answer SDP is what makes the offerer send RTP to
# rtpengine instead of peer-to-peer; rtpengine_manage() picks the
# right verb (offer / answer / delete) based on response code.
onreply_route[RTPENGINE_REPLY] {
    if (status =~ "(183)|(2[0-9][0-9])") {
        # 183 Session Progress and 2xx final answers carry SDP we
        # need to rewrite so the offerer's RTP lands on rtpengine.
        rtpengine_manage();
    }
}

# --- HTTP management endpoint ---
# Routes HTTP requests on port 8090 to the jsonrpcs handler.
# The admin UI's KamailioService posts JSON-RPC 2.0 payloads
# here to read dispatcher state and control drain/activate.
event_route[xhttp:request] {
    if ($hu =~ "^/jsonrpc") {
        jsonrpc_dispatch();
        exit;
    }
    xhttp_reply("404", "Not Found", "text/plain", "Only /jsonrpc is served here.\n");
    exit;
}
