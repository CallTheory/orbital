# Kamailio TLS profile — cert + key live on the shared `tls-certs`
# Docker volume that nginx-tls and acme.sh both write/read. Same
# paths every other consumer uses; rotation is automatic via the
# acme.sh deploy-hook → TlsRenewalWebhookController →
# ReloadServicesAfterCertRenewalJob → KamailioService::reloadTls().
#
# Used by both the SIP TLS listener (5061/tcp) and the WSS listener
# the operator softphone connects to (7443/tcp). One cert chain
# covers both because the SAN list includes the SIP-edge hostname.

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/tls/privkey.pem
certificate = /etc/tls/fullchain.pem

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
