[supervisord]
nodaemon=true
; No `user=` — the pod runs as non-root (uid 1000). supervisord runs as
; that user; php-fpm + nginx workers are already `sail` (uid 1000), and
; nginx binds an unprivileged port (8080), so nothing needs root.
logfile=/dev/stdout
logfile_maxbytes=0
; /run is root-owned; write the pidfile somewhere the non-root user can.
pidfile=/tmp/supervisord.pid

[program:php-fpm]
; Alpine's php-fpm binary lives at /usr/local/sbin/php-fpm and reads
; /usr/local/etc/php-fpm.conf by default; no --fpm-config needed.
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
