port: 7880

rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_ice_lite: true

# Mirrored in .env (LIVEKIT_API_KEY / LIVEKIT_API_SECRET) so the Laravel
# app and agent worker authenticate with the same credentials.
keys:
  APIorbitaldev4a85eae7: f4eca5232734d8d514da60b9a0f9c7c27b4b8473c550a442

logging:
  level: info

room:
  max_participants: 50
  empty_timeout: 300
  departure_timeout: 20

redis:
  # Valkey is fronted by HAProxy's redis VIP (haproxy:6379), which
  # routes to the current primary in the 3-node Sentinel pool — the
  # same endpoint rtpengine and the Laravel app (REDIS_HOST) use.
  # There is no bare `valkey` host; the nodes are valkey-1/2/3.
  address: haproxy:6379
  # Must match REDIS_PASSWORD in .env and the `--requirepass` value
  # on the valkey container. Regenerate via `openssl rand -hex 24`
  # and update all three in lockstep if you rotate it.
  password: 8b630691e6e6c2292489d353cbfbccdbdd6073cbcf680f72

# Webhook destination for LiveKit events (room_started, room_finished,
# track_published, egress_started, egress_ended). The orbital.test
# Laravel app catches the egress_ended payload via
# IngestLivekitEgressJob and writes a CallRecording row pointing at
# the Egress output (track WAVs in SeaweedFS).
webhook:
  api_key: APIorbitaldev4a85eae7
  urls:
    - http://orbital.test/api/livekit/webhook
