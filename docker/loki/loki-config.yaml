#
# Orbital Loki config — single-binary filesystem storage.
#
# HA story: two Loki instances run in parallel, each scraping
# Promtail feeds from its own host, each persisting chunks on its
# own volume. Grafana datasource goes through HAProxy which
# round-robins queries across both. This means query results only
# reflect one node's time window unless Promtail double-ships; in
# practice the drift is fine for ops dashboards and callers.
#
# A shared S3 backend (`loki-chunks` bucket in SeaweedFS) would
# give a unified view but Loki's compactor triggers DeleteObject
# calls that SeaweedFS S3 auth rejects with InvalidAccessKeyId
# even though identical creds work via aws-cli. Filed as
# follow-up; swap back to the S3 config when resolved.
#

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki-data
  storage:
    filesystem:
      chunks_directory: /loki-data/chunks
      rules_directory: /loki-data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki-data/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
