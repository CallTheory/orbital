#
# Orbital Loki config — shared S3 backend (SeaweedFS).
#
# HA story: two Loki instances run in parallel, each scraping
# Promtail feeds from its own host. Chunks + index land in the
# `loki-chunks` bucket on the clustered SeaweedFS filers via
# HAProxy's seaweed-s3 frontend. Both Lokis see the same data
# so Grafana round-robin queries return a unified view.
#
# Earlier attempts hit `InvalidAccessKeyId` on SeaweedFS DELETE
# requests from the compactor. Root cause was the multi-filer
# bootstrap hang (task #18) — with only filer-1 live, the
# compactor's DELETE traffic sometimes hit an address that the
# S3 gateway rejected. With filer-1 + filer-2 both healthy and
# HAProxy round-robin in front, DELETE works end-to-end.
#

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki-data
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: haproxy:8333
      bucketnames: loki-chunks
      access_key_id: ${AWS_ACCESS_KEY_ID}
      secret_access_key: ${AWS_SECRET_ACCESS_KEY}
      region: us-east-1
      s3forcepathstyle: true
      insecure: true

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki-data/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
