# Orbital — nginx TLS terminator.
#
# Terminates HTTPS on port 443 and proxies to the Laravel app
# on port 80. Also handles WebSocket upgrades for Reverb at
# the /app path so browsers can use wss://domain.com/app/...
# instead of an insecure ws:// connection.
#
# Cert files are read from the tls-certs shared volume. When no
# cert exists yet (fresh install, acme.sh hasn't run), nginx
# will fail to start — the entrypoint checks for the files and
# generates a temporary self-signed cert to bootstrap.
#
# In production, acme.sh writes real Let's Encrypt certs to
# the same volume and calls the deploy hook, which tells
# Laravel to dispatch a job that runs `nginx -s reload` inside
# this container.

# --- App pool — round-robin across 2 Laravel app instances.
# Stateless tier: sessions live in Valkey, cache/queue in Valkey,
# filesystem in SeaweedFS S3. Either instance can serve any
# request. `max_fails=2 fail_timeout=5s` kicks a bad node out of
# rotation fast.
upstream orbital_app {
    server orbital.test:80   max_fails=2 fail_timeout=5s;
    server orbital.test-2:80 max_fails=2 fail_timeout=5s;
}

# --- Reverb pool — sticky by source IP.
# Reverb scaling via Valkey pub/sub means any node can deliver
# any event, but ip_hash keeps a single browser session pinned
# to one node so we don't pay WS reconnect cost on every HTTP
# hop. Stickiness is a latency optimization, not a correctness
# requirement.
upstream reverb_pool {
    ip_hash;
    server reverb:8080   max_fails=2 fail_timeout=5s;
    server reverb-2:8080 max_fails=2 fail_timeout=5s;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS config — TLS 1.2+ only, strong ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # HSTS — tell browsers to always use HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # --- Web app (Laravel) — load-balanced across orbital_app pool.
    location / {
        proxy_pass http://orbital_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # --- Reverb WebSocket — sticky to one node per browser.
    location /app {
        proxy_pass http://reverb_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- Asterisk WebSocket (SIP.js softphone) ---
    # Operator softphones connect via wss://domain.com/asterisk/ws.
    # nginx upgrades to WebSocket and forwards to HAProxy's TCP
    # frontend on :8089, which source-hash balances across both
    # Asterisk nodes and lets operator drain mark one side DOWN
    # so new softphones land on the surviving node.
    location /asterisk/ws {
        proxy_pass https://haproxy:8089/asterisk/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        # Asterisk's WSS uses a self-signed cert internally —
        # nginx trusts it since we control both sides.
        proxy_ssl_verify off;
    }
}

# HTTP → HTTPS redirect for any plain-HTTP requests that hit 80.
# Only active if port 80 is mapped to this container (optional
# in dev where the app already serves on 80 directly).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
