# Orbital — nginx TLS terminator.
#
# Terminates HTTPS on port 443 and proxies to the Laravel app
# on port 80. Also handles WebSocket upgrades for Reverb at
# the /app path so browsers can use wss://domain.com/app/...
# instead of an insecure ws:// connection.
#
# Cert files are read from the tls-certs shared volume. When no
# cert exists yet (fresh install, acme.sh hasn't run), nginx
# will fail to start — the entrypoint checks for the files and
# generates a temporary self-signed cert to bootstrap.
#
# In production, acme.sh writes real Let's Encrypt certs to
# the same volume and calls the deploy hook, which tells
# Laravel to dispatch a job that runs `nginx -s reload` inside
# this container.

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS config — TLS 1.2+ only, strong ciphers.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # HSTS — tell browsers to always use HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;

    # --- Web app (Laravel) ---
    location / {
        proxy_pass http://orbital.test:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # --- Reverb WebSocket ---
    # Browsers connect to wss://domain.com/app/... and nginx
    # upgrades to WebSocket before proxying to Reverb on 8080.
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # --- Asterisk WebSocket (SIP.js softphone) ---
    # Operator softphones connect via wss://domain.com/asterisk/ws
    # and nginx upgrades to WebSocket before proxying to Asterisk's
    # HTTP server on 8089. This replaces the old direct
    # wss://localhost:8089/asterisk/ws path that broke under HTTPS
    # because of mixed-content and self-signed cert issues.
    location /asterisk/ws {
        proxy_pass https://asterisk:8089/asterisk/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        # Asterisk's WSS uses a self-signed cert internally —
        # nginx trusts it since we control both sides.
        proxy_ssl_verify off;
    }
}

# HTTP → HTTPS redirect for any plain-HTTP requests that hit 80.
# Only active if port 80 is mapped to this container (optional
# in dev where the app already serves on 80 directly).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
