#
# Orbital Promtail — ships logs from every running container to Loki.
#
# Uses the Docker service discovery source (docker_sd_configs) so it picks
# up all stack services automatically. No need to reconfigure Promtail when
# containers are added or removed.
#
# Mounts required on the Promtail container:
#   - /var/run/docker.sock (read-only)            — for discovery
#   - /var/lib/docker/containers (read-only)      — to tail json log files
#

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Pull the container name into a label so queries can filter by
      # container (e.g. {container="orbital-orbital.test-1"}).
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Bring over the compose service label if present
      # (com.docker.compose.service).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      # Static label for the stack so Grafana filters can narrow on it.
      - target_label: 'stack'
        replacement: 'orbital'
