; rtpengine config for the Orbital edge media-relay tier.
;
; Phase 1a: bind NG control on 0.0.0.0 so the Laravel app
; container can reach the daemon by hostname over the
; `telephony` Docker network (drachtio/rtpengine's default
; entrypoint binds to MY_IP only, which doesn't resolve
; correctly across our compose network).
;
; The RTP port range stays container-internal until Phase 1a's
; Kamailio integration lands — at that point Kamailio's
; route[RELAY] starts calling `rtpengine_manage()` and we
; expose the RTP range to the host. Before that, the daemon
; is only used by the Laravel app for NG ping/statistics
; aggregation in Failover Central + the Dashboard health card.

[rtpengine]
; The RTP-side interface rtpengine binds and advertises in SDP.
; Inside Docker, the container's compose-network attachment is
; eth0; rtpengine resolves the name to the interface's IP. Once
; we move to the edge VMs in production, this becomes the host's
; outbound NIC name.
interface=eth0
foreground=true
log-stderr=true
; Bind NG control on 0.0.0.0 so the Laravel app container can
; reach the daemon by hostname over the `telephony` network.
listen-ng=0.0.0.0:22222
port-min=23000
port-max=23099
recording-dir=/var/spool/rtpengine
recording-method=pcap
recording-format=eth
log-level=5
delete-delay=0
