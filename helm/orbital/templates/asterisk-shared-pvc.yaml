{{- if .Values.asterisk.enabled -}}
{{/*
Shared PVCs that both Laravel and the Asterisk StatefulSet mount.

- asterisk-config: Laravel writes the rendered dialplan
  (`AsteriskConfigService` output); Asterisk reads it on `module reload`.
- asterisk-prompts: Laravel renders TTS audio for disclosure /
  greeting prompts; Asterisk plays them at call time.

Both must be ReadWriteMany so multiple pods can mount concurrently.
On K3s with the default `local-path` provisioner this only works
for single-node clusters; production multi-node deployments need
a real RWX storage class (NFS, longhorn, EFS, Vultr's RWX option,
etc.). The values matrix flags this in per-provider defaults.
*/}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "orbital.componentName" (list . "asterisk-config") }}
  labels:
    {{- include "orbital.componentLabels" (list . "asterisk") | nindent 4 }}
spec:
  accessModes: [ReadWriteMany]
  {{- include "orbital.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "orbital.componentName" (list . "asterisk-prompts") }}
  labels:
    {{- include "orbital.componentLabels" (list . "asterisk") | nindent 4 }}
spec:
  accessModes: [ReadWriteMany]
  {{- include "orbital.storageClass" . | nindent 2 }}
  resources:
    requests:
      storage: 5Gi
{{- end }}
