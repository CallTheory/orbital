{{/*
Shared application env vars — mounted into Laravel + Horizon + Reverb
+ Asterisk + agent-worker. Renders connection details for stateful
deps (Postgres / Valkey / S3) based on whether the customer is using
the in-cluster default or an external service.

Secrets (passwords, API keys) live in `secrets-app-secrets` — the
customer creates that via `kubectl create secret` per
secrets.example.yaml. This configmap is the public, non-secret half.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbital.componentName" (list . "app-env") }}
  labels:
    {{- include "orbital.componentLabels" (list . "app-env") | nindent 4 }}
data:
  APP_ENV: production
  APP_URL: {{ .Values.global.appUrl | default (printf "https://%s" .Values.global.domain) | quote }}
  LOG_CHANNEL: stack
  LOG_LEVEL: info

  # Database
  DB_CONNECTION: pgsql
  {{- if .Values.postgres.external.enabled }}
  DB_HOST: {{ .Values.postgres.external.host | quote }}
  DB_PORT: {{ .Values.postgres.external.port | quote }}
  DB_DATABASE: {{ .Values.postgres.external.database | quote }}
  DB_USERNAME: {{ .Values.postgres.external.username | quote }}
  DB_SSLMODE: {{ .Values.postgres.external.sslMode | quote }}
  {{- else }}
  DB_HOST: {{ include "orbital.componentName" (list . "postgres") }}
  DB_PORT: "5432"
  DB_DATABASE: orbital
  DB_USERNAME: orbital
  {{- end }}

  # Cache / queue / broadcast
  REDIS_CLIENT: phpredis
  {{- if .Values.valkey.external.enabled }}
  REDIS_HOST: {{ .Values.valkey.external.host | quote }}
  REDIS_PORT: {{ .Values.valkey.external.port | quote }}
  {{- else }}
  REDIS_HOST: {{ include "orbital.componentName" (list . "valkey") }}
  REDIS_PORT: "6379"
  {{- end }}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  BROADCAST_CONNECTION: reverb
  SESSION_DRIVER: redis

  # Reverb. APP_ID + APP_KEY are public (browsers use the key); the
  # matching REVERB_APP_SECRET is sensitive and lives in the app-secrets
  # Secret (see secrets.example.yaml) — not here.
  REVERB_APP_ID: {{ .Values.reverb.appId | quote }}
  REVERB_APP_KEY: {{ .Values.reverb.appKey | quote }}
  REVERB_HOST: {{ include "orbital.componentName" (list . "reverb") }}
  REVERB_PORT: {{ .Values.reverb.service.port | quote }}
  REVERB_SCHEME: http     # ingress terminates TLS; intra-cluster is plain

  # Storage (recordings, voicemail, prompts)
  FILESYSTEM_DISK: s3
  {{- if .Values.objectStorage.external.enabled }}
  AWS_ENDPOINT: {{ .Values.objectStorage.external.s3Endpoint | quote }}
  AWS_DEFAULT_REGION: {{ .Values.objectStorage.external.region | quote }}
  AWS_BUCKET: {{ .Values.objectStorage.external.bucket | quote }}
  {{- else }}
  AWS_ENDPOINT: "http://{{ include "orbital.componentName" (list . "seaweedfs-filer") }}:8333"
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: orbital-recordings
  {{- end }}
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  # System-status dashboard: components not deployed in this topology
  # render as "not deployed" instead of red (see values health block).
  HEALTH_DISABLED_COMPONENTS: {{ .Values.health.disabledComponents | quote }}

  # Asterisk config/prompt handoff. In-cluster there is no shared RWX
  # volume: Laravel/Horizon write generated dialplan + TTS prompts to
  # object storage under these prefixes, and each Asterisk pod's
  # config-sync sidecar pulls them into a local emptyDir. Flipping the
  # driver to s3 is what routes the app's `asterisk-config` /
  # `asterisk-prompts` disks at object storage instead of local files.
  ASTERISK_STORAGE_DRIVER: s3
  ASTERISK_CONFIG_PREFIX: asterisk/config
  ASTERISK_PROMPTS_PREFIX: asterisk/prompts

  # Telephony — internal hostnames the Filament admin reaches
  ASTERISK_AMI_HOST: {{ include "orbital.componentName" (list . "asterisk-headless") }}
  ASTERISK_AMI_PORT: "5038"
  ASTERISK_AMI_USERNAME: orbital
  {{- if .Values.telephony.kamailio.enabled }}
  # Off-cluster Kamailio edge (VMs in prod; host-published in local test).
  KAMAILIO_ENABLED: "true"
  KAMAILIO_JSONRPC_URL: {{ .Values.telephony.kamailio.jsonrpcUrl | quote }}
  KAMAILIO_JSONRPC_URLS: {{ .Values.telephony.kamailio.jsonrpcUrl | quote }}
  {{- end }}
  LIVEKIT_URL: "ws://{{ include "orbital.componentName" (list . "livekit") }}:{{ .Values.livekit.service.port }}"
  LIVEKIT_SIP_HOST: {{ include "orbital.componentName" (list . "livekit-sip") }}
  LIVEKIT_SIP_PORT: {{ .Values.livekitSip.service.sipPort | quote }}

  # Shared secret the agent-worker heartbeat POSTs with; the Laravel
  # /api/agent-worker/heartbeat route validates against this same value.
  AGENT_WORKER_TOKEN: {{ .Values.agentWorker.token | quote }}

  # AGPL section 13 — where the corresponding source for THIS build
  # lives. Anyone running MODIFIED Orbital must repoint this at their
  # own repository; the panel footers, /source, /api/version, and the
  # About page all resolve from it, so leaving it aimed upstream sends
  # your users to source that isn't what they're running.
  ORBITAL_SOURCE_URL: {{ .Values.licensing.sourceUrl | quote }}
  ORBITAL_VERSION: {{ .Values.global.image.tag | quote }}
  ORBITAL_RELEASE_CHANNEL: {{ .Values.licensing.releaseChannel | quote }}

  # Metrics. /metrics is per-pod (HTTP counters keyed by METRICS_INSTANCE,
  # which defaults to the pod hostname — so scraping N replicas yields N
  # honest series rather than N copies of one total). Deployment-wide
  # numbers are pushed by the scheduler's orbital:collect-metrics instead;
  # see config/metrics.php for why that split matters.
  METRICS_ENABLED: {{ .Values.metrics.enabled | quote }}
  {{- if .Values.metrics.pushgateway.enabled }}
  METRICS_PUSHGATEWAY_ENABLED: "true"
  METRICS_PUSHGATEWAY_URL: {{ .Values.metrics.pushgateway.url | quote }}
  {{- else }}
  METRICS_PUSHGATEWAY_ENABLED: "false"
  {{- end }}

  # Nightly encrypted database backup, run by the scheduler pod.
  # Credentials live in app-secrets: BACKUP_ENCRYPTION_KEY,
  # BACKUP_AWS_ACCESS_KEY_ID, BACKUP_AWS_SECRET_ACCESS_KEY. The key
  # alone does nothing without them, and vice versa.
  {{- if .Values.backups.enabled }}
  BACKUP_ENABLED: "true"
  BACKUP_KEEP_DAYS: {{ .Values.backups.keepDays | quote }}
  BACKUP_AWS_BUCKET: {{ .Values.backups.bucket | quote }}
  BACKUP_AWS_DEFAULT_REGION: {{ .Values.backups.region | quote }}
  {{- with .Values.backups.endpoint }}
  BACKUP_AWS_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- else }}
  BACKUP_ENABLED: "false"
  {{- end }}

  # Optional observability integrations. Both off by default and both
  # inert when off — no exporter is built and no listeners are attached.
  #
  # The credentials are NOT here: ERROR_REPORTING_DSN, TRACING_AUTH_USERNAME
  # and TRACING_AUTH_SECRET come from the app-secrets Secret, which every
  # pod already picks up via secretRef. See templates/secrets.example.yaml.
  #
  # Changing any of these rolls the app pods (the checksum annotation on the
  # laravel Deployment covers this ConfigMap). That is wanted: Horizon and
  # the scheduler resolve config once at boot, so a value they never restart
  # to see is a value that quietly does not apply.
  {{- if .Values.observability.tracing.enabled }}
  TRACING_ENABLED: "true"
  TRACING_ENDPOINT: {{ .Values.observability.tracing.endpoint | quote }}
  TRACING_SERVICE_NAME: {{ .Values.observability.tracing.serviceName | quote }}
  TRACING_SAMPLE_RATIO: {{ .Values.observability.tracing.sampleRatio | quote }}
  TRACING_AUTH_MODE: {{ .Values.observability.tracing.authMode | quote }}
  {{- else }}
  TRACING_ENABLED: "false"
  {{- end }}
  {{- if .Values.observability.errors.enabled }}
  ERROR_REPORTING_ENABLED: "true"
  {{- with .Values.observability.errors.environment }}
  ERROR_REPORTING_ENVIRONMENT: {{ . | quote }}
  {{- end }}
  {{- else }}
  ERROR_REPORTING_ENABLED: "false"
  {{- end }}

  # Two-factor enforcement. The grace clock starts on each user's first
  # request under the policy, so enabling this never retroactively locks
  # out existing users.
  TWO_FACTOR_REQUIRED: {{ .Values.security.twoFactorRequired | quote }}
  TWO_FACTOR_GRACE_DAYS: {{ .Values.security.twoFactorGraceDays | quote }}
