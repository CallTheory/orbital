{{- if .Values.ingress.enabled -}}
{{/*
Public ingress for Orbital. Routes HTTPS to the Laravel admin panel and
WSS to the Reverb broadcast server. The host is always global.domain
(same value APP_URL is built from). Per-host TLS via cert-manager (when
a cluster-issuer annotation is set in ingress.annotations) or a manually
provisioned secret; toggle with ingress.tls.enabled.

The provider-specific ingressClassName comes from values:
  values-vultr-k3s.yaml → traefik
  values-vultr-vke.yaml → traefik (installed by orbital-setup)
  values-onprem-k3s.yaml → traefik
*/}}
{{- $host := .Values.global.domain -}}
{{- $tlsSecret := .Values.ingress.tls.secretName | default (printf "%s-tls" (include "orbital.fullname" .)) -}}
{{/* Always-on annotations + TLS-only annotations (cert-manager issuer,
     traefik websecure/tls, etc.) merged in ONLY when TLS is enabled — so
     an http/dev install isn't pinned to the https entrypoint. */}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
{{- if .Values.ingress.tls.enabled -}}
{{- $annotations = merge $annotations (deepCopy (.Values.ingress.tlsAnnotations | default dict)) -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orbital.componentName" (list . "ingress") }}
  labels:
    {{- include "orbital.componentLabels" (list . "ingress") | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $host | quote }}
        {{- if and .Values.livekit.enabled .Values.livekit.public.enabled }}
        - {{ include "orbital.livekitPublicHost" . | quote }}
        {{- end }}
      secretName: {{ $tlsSecret | quote }}
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "orbital.componentName" (list $ .service) }}
                port:
                  number: {{ if eq .service "reverb" }}{{ $.Values.reverb.service.port }}{{ else }}{{ $.Values.laravel.service.port }}{{ end }}
          {{- end }}
    {{- if and .Values.livekit.enabled .Values.livekit.public.enabled }}
    # LiveKit signaling (WSS) for browsers; media bypasses the ingress.
    - host: {{ include "orbital.livekitPublicHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "orbital.componentName" (list . "livekit") }}
                port:
                  number: {{ .Values.livekit.service.port }}
    {{- end }}
{{- end }}
