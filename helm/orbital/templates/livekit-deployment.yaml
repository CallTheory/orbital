{{- if .Values.livekit.enabled -}}
{{/*
LiveKit — WebRTC media server for AI agent voice sessions.

Cluster-internal only. External SIP traffic enters via
the rtpengine edge (NOT through this LiveKit pod), then hops
to LiveKit-SIP, which bridges into LiveKit. Operator browsers
connecting for in-room observation go through the ingress.

Phase 2 dropped the wide RTP port range (50000-60000) that the
docker-compose setup used — rtpengine owns RTP at the edge, so
internal LiveKit only needs its API port and a small ICE-mux range.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbital.componentName" (list . "livekit") }}
  labels:
    {{- include "orbital.componentLabels" (list . "livekit") | nindent 4 }}
spec:
  replicas: {{ .Values.livekit.replicas }}
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "livekit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "livekit") | nindent 8 }}
    spec:
      {{/* Keep replicas on separate nodes — see the helper. */}}
      {{- include "orbital.topologySpread" (list . "livekit") | nindent 6 }}
      containers:
        - name: livekit
          image: {{ include "orbital.thirdPartyImage" .Values.livekit.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 7880
              protocol: TCP
          env:
            # LiveKit config is injected wholesale via LIVEKIT_CONFIG (not a
            # mounted file) so secrets — the API key/secret AND the Valkey
            # password — reach it through env. The config format does not
            # expand ${VARS}, so these come from the Secret as explicit env
            # vars and are spliced in with K8s dependent-var expansion
            # ($(...) sees only earlier entries in THIS list).
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: REDIS_PASSWORD
            - name: LIVEKIT_KEYS
              value: "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
            - name: LIVEKIT_CONFIG
              value: |
                port: 7880
                rtc:
                  port_range_start: 50000
                  port_range_end: 50100
                  tcp_port: 7881
                  use_ice_lite: true
                redis:
                  address: {{ if .Values.valkey.external.enabled }}{{ .Values.valkey.external.host }}:{{ .Values.valkey.external.port }}{{ else }}{{ include "orbital.componentName" (list . "valkey") }}:6379{{ end }}
                  password: $(REDIS_PASSWORD)
                logging:
                  level: info
                room:
                  max_participants: 50
                  empty_timeout: 300
                  departure_timeout: 20
                webhook:
                  api_key: {{ .Values.livekit.apiKey | quote }}
                  urls:
                    - http://{{ include "orbital.componentName" (list . "laravel") }}:{{ .Values.laravel.service.port }}/api/livekit/webhook
          resources:
            {{- toYaml .Values.livekit.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
{{- end }}
