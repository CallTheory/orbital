{{- if .Values.livekit.enabled -}}
{{/*
LiveKit — WebRTC media server for AI agent voice sessions.

External SIP traffic enters via the rtpengine edge (NOT through
this LiveKit pod), then hops to LiveKit-SIP, which bridges into
LiveKit. By default LiveKit is cluster-internal with a small ICE
range. With livekit.public on, browsers outside the cluster join
rooms: signaling via the ingress, media on the node's public IP
(node network, wide UDP range + TCP fallback).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbital.componentName" (list . "livekit") }}
  labels:
    {{- include "orbital.componentLabels" (list . "livekit") | nindent 4 }}
spec:
  replicas: {{ .Values.livekit.replicas }}
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "livekit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "livekit") | nindent 8 }}
    spec:
      {{- if .Values.livekit.public.enabled }}
      # Node network so ICE candidates are the node's addresses. One per
      # node: replicas would collide on the RTC ports.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "orbital.selectorLabels" (list . "livekit") | nindent 18 }}
      {{- else }}
      {{/* Keep replicas on separate nodes — see the helper. */}}
      {{- include "orbital.topologySpread" (list . "livekit") | nindent 6 }}
      {{- end }}
      containers:
        - name: livekit
          image: {{ include "orbital.thirdPartyImage" .Values.livekit.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 7880
              protocol: TCP
          env:
            # LiveKit config is injected wholesale via LIVEKIT_CONFIG (not a
            # mounted file) so secrets — the API key/secret AND the Valkey
            # password — reach it through env. The config format does not
            # expand ${VARS}, so these come from the Secret as explicit env
            # vars and are spliced in with K8s dependent-var expansion
            # ($(...) sees only earlier entries in THIS list).
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: REDIS_PASSWORD
            - name: LIVEKIT_KEYS
              value: "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
            - name: LIVEKIT_CONFIG
              value: |
                port: 7880
                rtc:
                  {{- if .Values.livekit.public.enabled }}
                  port_range_start: {{ .Values.livekit.public.udpPortStart }}
                  port_range_end: {{ .Values.livekit.public.udpPortEnd }}
                  tcp_port: {{ .Values.livekit.public.tcpPort }}
                  # Advertise the node's public IP (found via STUN) as well
                  # as its local addresses, so browsers and pods both connect.
                  use_external_ip: true
                  {{- else }}
                  port_range_start: 50000
                  port_range_end: 50100
                  tcp_port: 7881
                  {{- end }}
                  use_ice_lite: true
                redis:
                  address: {{ if .Values.valkey.external.enabled }}{{ .Values.valkey.external.host }}:{{ .Values.valkey.external.port }}{{ else }}{{ include "orbital.componentName" (list . "valkey") }}:6379{{ end }}
                  password: $(REDIS_PASSWORD)
                logging:
                  level: info
                room:
                  max_participants: 50
                  empty_timeout: 300
                  departure_timeout: 20
                webhook:
                  # Must be a key in LIVEKIT_KEYS, i.e. the Secret's key.
                  api_key: $(LIVEKIT_API_KEY)
                  urls:
                    - http://{{ include "orbital.componentName" (list . "laravel") }}:{{ .Values.laravel.service.port }}/api/livekit/webhook
          resources:
            {{- toYaml .Values.livekit.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
{{- end }}
