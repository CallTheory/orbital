{{- if .Values.livekit.enabled -}}
{{/*
LiveKit — WebRTC media server for AI agent voice sessions.

Cluster-internal only. External SIP traffic enters via
the rtpengine edge (NOT through this LiveKit pod), then hops
to LiveKit-SIP, which bridges into LiveKit. Operator browsers
connecting for in-room observation go through the ingress.

Phase 2 dropped the wide RTP port range (50000-60000) that the
docker-compose setup used — rtpengine owns RTP at the edge, so
internal LiveKit only needs its API port and a small ICE-mux range.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbital.componentName" (list . "livekit") }}
  labels:
    {{- include "orbital.componentLabels" (list . "livekit") | nindent 4 }}
spec:
  replicas: {{ .Values.livekit.replicas }}
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "livekit") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "livekit") | nindent 8 }}
    spec:
      containers:
        - name: livekit
          image: {{ include "orbital.thirdPartyImage" .Values.livekit.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 7880
              protocol: TCP
          env:
            # LiveKit's `keys:` map cannot be populated from a secret via
            # the config file (no ${VAR} expansion), so the API key/secret
            # are injected as the LIVEKIT_KEYS env var in "<key>: <secret>"
            # form. Both halves are pulled from the app-secrets Secret and
            # composed via K8s dependent-var expansion — which only sees
            # vars defined earlier in THIS env list, hence the explicit
            # secretKeyRefs (envFrom vars aren't visible to $(...)).
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_SECRET
            - name: LIVEKIT_KEYS
              value: "$(LIVEKIT_API_KEY): $(LIVEKIT_API_SECRET)"
            # LiveKit reads the rest of its config from this mounted file.
            - name: LIVEKIT_CONFIG_FILE
              value: /etc/livekit/livekit.yaml
          envFrom:
            - secretRef:
                name: {{ include "orbital.componentName" (list . "app-secrets") }}
          resources:
            {{- toYaml .Values.livekit.resources | nindent 12 }}
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: livekit-config
          configMap:
            name: {{ include "orbital.componentName" (list . "livekit-config") }}
{{- end }}
