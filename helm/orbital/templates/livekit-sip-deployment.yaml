{{- if .Values.livekitSip.enabled -}}
{{/*
LiveKit-SIP — bridges SIP signaling into LiveKit rooms.

Cluster-internal SIP only (port 5069). External SIP enters via the
Kamailio + rtpengine edge; Kamailio dispatches to this pod when an
inbound dialog matches a routing rule that targets a LiveKit AI agent.
RTP relay is handled by rtpengine at the edge — no UDP port range
exposed here.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbital.componentName" (list . "livekit-sip") }}
  labels:
    {{- include "orbital.componentLabels" (list . "livekit-sip") | nindent 4 }}
spec:
  replicas: {{ .Values.livekitSip.replicas }}
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "livekit-sip") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "livekit-sip") | nindent 8 }}
    spec:
      containers:
        - name: livekit-sip
          image: {{ include "orbital.thirdPartyImage" .Values.livekitSip.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: sip
              containerPort: {{ .Values.livekitSip.service.sipPort }}
              protocol: UDP
          env:
            # Inject the whole SIP config via SIP_CONFIG_BODY. The config
            # format does NOT expand ${VARS}, so secrets (LiveKit API
            # key/secret + the Valkey password) are pulled from the Secret
            # as explicit env vars and spliced in via K8s dependent-var
            # expansion — $(...) resolves against earlier entries in THIS
            # env list. Nothing sensitive lands in a ConfigMap, and there's
            # no config file to mount.
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_KEY
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: LIVEKIT_API_SECRET
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "orbital.componentName" (list . "app-secrets") }}
                  key: REDIS_PASSWORD
            - name: SIP_CONFIG_BODY
              value: |
                api_key: $(LIVEKIT_API_KEY)
                api_secret: $(LIVEKIT_API_SECRET)
                ws_url: ws://{{ include "orbital.componentName" (list . "livekit") }}:{{ .Values.livekit.service.port }}
                redis:
                  address: {{ if .Values.valkey.external.enabled }}{{ .Values.valkey.external.host }}:{{ .Values.valkey.external.port }}{{ else }}{{ include "orbital.componentName" (list . "valkey") }}:6379{{ end }}
                  password: $(REDIS_PASSWORD)
                sip_port: {{ .Values.livekitSip.service.sipPort }}
          resources:
            {{- toYaml .Values.livekitSip.resources | nindent 12 }}
{{- end }}
