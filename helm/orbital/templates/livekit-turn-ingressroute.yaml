{{- if and .Values.livekit.enabled .Values.livekit.public.enabled .Values.livekit.public.turn.enabled -}}
{{/*
TURN/TLS for LiveKit through Traefik's websecure entrypoint: TLS for
turn.<domain> ends here (certificate shared with the app's Ingress) and
the TURN stream continues as plain TCP to LiveKit's TURN listener.
*/}}
{{- $tlsSecret := .Values.ingress.tls.secretName | default (printf "%s-tls" (include "orbital.fullname" .)) }}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "orbital.componentName" (list . "livekit-turn") }}
  labels:
    {{- include "orbital.componentLabels" (list . "livekit") | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ include "orbital.livekitTurnHost" . }}`)
      services:
        - name: {{ include "orbital.componentName" (list . "livekit") }}
          port: 443
  tls:
    secretName: {{ $tlsSecret }}
{{- end }}
