{{- if .Values.ollama.enabled -}}
{{/*
Ollama — local embeddings and inference (see values ollama). Off by
default. The app reaches it at OLLAMA_URL, which configmap-app-env
sets to this Service while it's enabled.

A StatefulSet for its model volume: pulled models survive restarts
instead of downloading again.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orbital.componentName" (list . "ollama") }}
  labels:
    {{- include "orbital.componentLabels" (list . "ollama") | nindent 4 }}
spec:
  serviceName: {{ include "orbital.componentName" (list . "ollama") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "ollama") | nindent 8 }}
    spec:
      {{- include "orbital.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ollama
          image: {{ include "orbital.thirdPartyImage" .Values.ollama.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # The image keeps models under $HOME/.ollama; as a non-root
            # user HOME must point somewhere writable, i.e. the volume.
            - name: HOME
              value: /data
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /data
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "orbital.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ include "orbital.volumeSize" (list . .Values.ollama.persistence.size) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbital.componentName" (list . "ollama") }}
  labels:
    {{- include "orbital.componentLabels" (list . "ollama") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orbital.selectorLabels" (list . "ollama") | nindent 4 }}
{{- end }}
