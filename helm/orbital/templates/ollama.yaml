{{- if .Values.ollama.enabled -}}
{{/*
Ollama — self-hosted embeddings and inference (see values ollama). On
by default. The app reaches it at OLLAMA_URL, which configmap-app-env
sets to this Service while it's enabled, and new knowledge stores
default to the first of ollama.models (EMBEDDINGS_DEFAULT_PROVIDER).

A StatefulSet for its model volume: pulled models survive restarts
instead of downloading again.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orbital.componentName" (list . "ollama") }}
  labels:
    {{- include "orbital.componentLabels" (list . "ollama") | nindent 4 }}
spec:
  serviceName: {{ include "orbital.componentName" (list . "ollama") }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "ollama") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "ollama") | nindent 8 }}
    spec:
      {{- include "orbital.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ollama
          image: {{ include "orbital.thirdPartyImage" .Values.ollama.image }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # The image keeps models under $HOME/.ollama; as a non-root
            # user HOME must point somewhere writable, i.e. the volume.
            - name: HOME
              value: /data
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          volumeMounts:
            - name: models
              mountPath: /data
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
        {{- with .Values.ollama.models }}
        # Pulls ollama.models into the shared volume once the server in
        # this pod answers, then idles. A sidecar rather than a Helm hook
        # or init container: a slow or offline download must never hold
        # up an install or the Ollama server itself. It keeps retrying a
        # failed pull (no internet yet, registry hiccup) every minute.
        - name: model-pull
          image: {{ include "orbital.thirdPartyImage" $.Values.ollama.image }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            - name: HOME
              value: /data
            - name: OLLAMA_HOST
              value: "127.0.0.1:11434"
            - name: OLLAMA_MODELS_TO_PULL
              value: {{ join " " . | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until ollama list >/dev/null 2>&1; do sleep 2; done
              for model in $OLLAMA_MODELS_TO_PULL; do
                until ollama pull "$model"; do
                  echo "pull of $model failed; retrying in 60s" >&2
                  sleep 60
                done
              done
              echo "models ready: $OLLAMA_MODELS_TO_PULL"
              exec sleep infinity
          volumeMounts:
            - name: models
              mountPath: /data
          resources:
            requests: {cpu: "10m", memory: "32Mi"}
            limits: {cpu: "500m", memory: "256Mi"}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "orbital.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ include "orbital.volumeSize" (list . .Values.ollama.persistence.size) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbital.componentName" (list . "ollama") }}
  labels:
    {{- include "orbital.componentLabels" (list . "ollama") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 11434
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orbital.selectorLabels" (list . "ollama") | nindent 4 }}
{{- end }}
