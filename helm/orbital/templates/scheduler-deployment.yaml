{{- if .Values.scheduler.enabled -}}
{{/*
Scheduler — runs `php artisan schedule:work` (the Laravel cron loop).
Without it NOTHING scheduled fires: the scheduler heartbeat, recording
prune, queue-metric rollups, cert-renewal checks, etc. Same image as
laravel, different command. Singleton by default; every scheduled task
carries onOneServer() so replicas are safe, but 1 is plenty here.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orbital.componentName" (list . "scheduler") }}
  labels:
    {{- include "orbital.componentLabels" (list . "scheduler") | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicas }}
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "scheduler") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "scheduler") | nindent 8 }}
      annotations:
        checksum/app-env: {{ include (print $.Template.BasePath "/configmap-app-env.yaml") . | sha256sum }}
    spec:
      {{- include "orbital.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "orbital.image" (dict "ctx" . "name" .Values.laravel.image.name "tag" .Values.laravel.image.tag) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["php", "artisan", "schedule:work"]
          envFrom:
            - configMapRef:
                name: {{ include "orbital.componentName" (list . "failover-tiers") }}
            - configMapRef:
                name: {{ include "orbital.componentName" (list . "app-env") }}
            - secretRef:
                name: {{ include "orbital.componentName" (list . "app-secrets") }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          # schedule:work exits non-zero if the loop dies; k8s restarts it.
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f 'schedule:work' >/dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      terminationGracePeriodSeconds: 60
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
