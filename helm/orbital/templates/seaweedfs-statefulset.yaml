{{- if not .Values.objectStorage.external.enabled -}}
{{/*
In-cluster SeaweedFS — single-pod combined master + volume + filer
running in `server` mode. Provides an S3-compatible endpoint on
port 8333 that Laravel uses for recording / voicemail / prompt
storage.

Same simplicity philosophy as the Postgres / Valkey templates:
HA SeaweedFS (separate masters + volume + filer pods) belongs
behind a future operator-based opt-in, or customers flip to
external.enabled=true and use real S3 / Vultr Object Storage.

The S3 credentials Laravel uses (AWS_ACCESS_KEY_ID /
AWS_SECRET_ACCESS_KEY) are baked into the seaweed config via
init script — for v1 simplicity we ship a default key pair the
chart writes via configmap. Customers wanting per-deploy random
keys can override `objectStorage.inCluster.s3KeyId` /
`objectStorage.inCluster.s3SecretKey` in values.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orbital.componentName" (list . "seaweedfs") }}
  labels:
    {{- include "orbital.componentLabels" (list . "seaweedfs") | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "orbital.componentName" (list . "seaweedfs-filer") }}
  selector:
    matchLabels:
      {{- include "orbital.selectorLabels" (list . "seaweedfs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "orbital.componentLabels" (list . "seaweedfs") | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ include "orbital.thirdPartyImage" .Values.objectStorage.inCluster.image }}
          imagePullPolicy: IfNotPresent
          # The mounted s3.json is a ConfigMap, which does NOT expand the
          # ${AWS_ACCESS_KEY_ID}/${AWS_SECRET_ACCESS_KEY} placeholders — so
          # substitute them from env (app-secrets) into a writable copy
          # before starting weed. Without this SeaweedFS's S3 identity is
          # the literal "${AWS_ACCESS_KEY_ID}" and every authenticated
          # request fails with InvalidAccessKeyId.
          command:
            - sh
            - -c
            - |
              set -e
              sed -e "s|\${AWS_ACCESS_KEY_ID}|${AWS_ACCESS_KEY_ID}|g" \
                  -e "s|\${AWS_SECRET_ACCESS_KEY}|${AWS_SECRET_ACCESS_KEY}|g" \
                  /etc/seaweedfs/s3.json > /tmp/s3.json
              exec weed server -dir=/data -master.volumeSizeLimitMB=1024 \
                -volume.max=20 -filer -filer.maxMB=4 -s3 -s3.config=/tmp/s3.json
          ports:
            - name: master
              containerPort: 9333
            - name: volume
              containerPort: 8080
            - name: filer
              containerPort: 8888
            - name: s3
              containerPort: 8333
          envFrom:
            - secretRef:
                name: {{ include "orbital.componentName" (list . "app-secrets") }}
          resources:
            {{- toYaml .Values.objectStorage.inCluster.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: filer
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: filer
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: s3-config
          configMap:
            name: {{ include "orbital.componentName" (list . "seaweedfs-config") }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- include "orbital.storageClass" . | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.objectStorage.inCluster.persistence.volumeSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbital.componentName" (list . "seaweedfs-filer") }}
  labels:
    {{- include "orbital.componentLabels" (list . "seaweedfs") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8333
      targetPort: s3
      name: s3
    - port: 8888
      targetPort: filer
      name: filer
  selector:
    {{- include "orbital.selectorLabels" (list . "seaweedfs") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "orbital.componentName" (list . "seaweedfs-config") }}
  labels:
    {{- include "orbital.componentLabels" (list . "seaweedfs") | nindent 4 }}
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "orbital",
          "credentials": [
            {
              "accessKey": "${AWS_ACCESS_KEY_ID}",
              "secretKey": "${AWS_SECRET_ACCESS_KEY}"
            }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
{{- end }}
