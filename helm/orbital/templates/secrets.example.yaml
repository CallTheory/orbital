{{/*
EXAMPLE secret manifests — NOT rendered at install time. Use the
recipes here to create the secrets the chart expects, OR pass them
through external-secrets-operator referencing a vault / SSM / etc.

Required secrets:
  - {release}-orbital-app-secrets   — app-level secrets
  - postgres-creds                  — only if postgres.external.enabled
  - valkey-creds                    — only if valkey.external.enabled
  - object-storage-creds            — only if objectStorage.external.enabled
  - orbital-registry-creds          — Harbor pull secret (per onboarding)

Create them with:

  # 1. Image pull secret (matches global.imagePullSecrets[].name)
  kubectl create secret docker-registry orbital-registry-creds \
    --namespace orbital \
    --docker-server=cr.calltheory.com \
    --docker-username='robot$<your-customer-tag>-pull' \
    --docker-password='<your-token>'

  # 2. App-level secrets
  kubectl create secret generic {release}-orbital-app-secrets \
    --namespace orbital \
    --from-literal=APP_KEY='base64:<generate via php artisan key:generate>' \
    --from-literal=DB_PASSWORD='<your-db-password>' \
    --from-literal=REDIS_PASSWORD='<your-valkey-password>' \
    --from-literal=REVERB_APP_SECRET='<reverb-app-secret — must match reverb.appKey/appId>' \
    --from-literal=AWS_ACCESS_KEY_ID='<s3-key>' \
    --from-literal=AWS_SECRET_ACCESS_KEY='<s3-secret>' \
    --from-literal=LIVEKIT_API_KEY='<api-key>' \
    --from-literal=LIVEKIT_API_SECRET='<api-secret>' \
    --from-literal=ASTERISK_AMI_SECRET='<ami-secret>' \
    --from-literal=ANTHROPIC_API_KEY='<claude-key>' \
    --from-literal=OPENAI_API_KEY='<openai-key>' \
    --from-literal=ELEVENLABS_API_KEY='<elevenlabs-key>'

  # 2b. Optional observability integrations. Add these ONLY if you set
  #     observability.errors.enabled or observability.tracing.enabled in
  #     values — the non-secret half of each lives in the app-env
  #     ConfigMap, and the flag alone does nothing without the credential
  #     below. That is deliberate: a half-configured integration that
  #     looks enabled but silently discards everything is worse than one
  #     that is plainly off.
  #
  #     ERROR_REPORTING_DSN     GlitchTip: Settings -> Projects -> DSN.
  #                             Sentry: Settings -> Projects -> Client Keys.
  #     TRACING_AUTH_USERNAME   Basic auth only. Grafana Cloud: the numeric
  #                             instance ID from the Tempo datasource page.
  #     TRACING_AUTH_SECRET     Token or password. Blank sends no
  #                             Authorization header at all.
  #
  #     Append to the same app-secrets create above, or patch it:
  kubectl create secret generic {release}-orbital-app-secrets \
    --from-literal=ERROR_REPORTING_DSN='<glitchtip-or-sentry-dsn>' \
    --from-literal=TRACING_AUTH_USERNAME='<instance-id, basic auth only>' \
    --from-literal=TRACING_AUTH_SECRET='<otlp-token>'

  # 2c. Backups (only if backups.enabled=true in values).
  #
  #     BACKUP_ENCRYPTION_KEY  generate with:
  #                              php artisan orbital:backup --generate-key
  #                            STORE IT OUTSIDE THE CLUSTER. Losing it
  #                            means losing every archive taken with it,
  #                            and "the cluster is gone" is the scenario
  #                            backups exist for.
  #     BACKUP_AWS_*           a DIFFERENT bucket and key from the app's
  #                            object storage — backups under the app's
  #                            own credential die with it.
  kubectl create secret generic {release}-orbital-app-secrets \
    --from-literal=BACKUP_ENCRYPTION_KEY='<generated-key>' \
    --from-literal=BACKUP_AWS_ACCESS_KEY_ID='<backup-bucket-key>' \
    --from-literal=BACKUP_AWS_SECRET_ACCESS_KEY='<backup-bucket-secret>'

  # 3. (only if external.enabled=true on the matching tier)
  kubectl create secret generic postgres-creds \
    --from-literal=password='<managed-postgres-password>'
  kubectl create secret generic valkey-creds \
    --from-literal=password='<managed-valkey-password>'
  kubectl create secret generic object-storage-creds \
    --from-literal=access_key='<s3-access-key>' \
    --from-literal=secret_key='<s3-secret-key>'

The chart never renders these — having `kubectl create secret`
emit them keeps secret material out of git history, out of helm
release metadata, and out of the chart values that would otherwise
be `helm get values`-able by anyone with cluster read.
*/}}
