# On-prem K3s overrides.
#
# Apply with:
#   helm install orbital ./helm/orbital \
#     -f ./helm/orbital/values-onprem-k3s.yaml \
#     --set global.domain=orbital.your-company.com
#
# Assumes:
# - K3s installed via the standard `curl | sh` install script (Traefik
#   ingress + ServiceLB + local-path storage all default-on).
# - `kubectl create secret docker-registry orbital-registry-creds`
#   created beforehand with the customer's Harbor robot creds.
#
# No ReadWriteMany storage class is required: Asterisk config + prompts
# are handed off through object storage (in-cluster SeaweedFS by
# default), not a shared RWX PVC. Every PVC in the chart is per-pod RWO,
# which local-path serves fine — including multi-node.

global:
  storageClass: "local-path"

ingress:
  className: "traefik"
  # TLS-only annotations — applied only when ingress.tls.enabled. With
  # TLS off (local http dev) these are omitted, so Traefik doesn't pin
  # the router to the https-only `websecure` entrypoint (which 404s
  # plain-http requests on :8080).
  tlsAnnotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"

# Asterisk scales freely on local-path now — the config/prompt handoff
# goes through object storage, so there's no cross-pod RWX requirement.
# Each pod pulls its own dialplan copy via the config-sync sidecar and
# owns a per-pod RWO spool PVC. Left at the chart default (2) for HA;
# drop to 1 for a minimal single-node install if you want.

# K3s default Traefik LoadBalancer is klipper-lb (host-port mapping).
# That's fine — the public IP of the K3s node is the LB IP.
