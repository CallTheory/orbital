# Vultr self-hosted K3s overrides.
#
# Apply with:
#   helm install orbital ./helm/orbital \
#     -f ./helm/orbital/values-vultr-k3s.yaml \
#     --set global.domain=orbital.your-company.com
#
# Assumes the OpenTofu module at `terraform/vultr/self-hosted-k3s/`
# in the orbital-setup repo has provisioned the K3s cluster. That module
# installs the Vultr CSI driver (vultr-block-storage) and a Vultr cloud
# controller (vultr-load-balancer for Service type=LoadBalancer).

global:
  storageClass: "vultr-block-storage"

ingress:
  className: "traefik"
  annotations:
    # Tells the Vultr cloud controller to provision a managed LB.
    service.beta.kubernetes.io/vultr-loadbalancer-protocol: "https"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

# Asterisk runs multi-replica on vultr-block-storage (RWO) — the
# dialplan/prompt handoff is object-storage based, so no RWX class is
# needed. Scaled to 2 for HA.
asterisk:
  replicas: 2

# Vultr instance sizes — slightly bumped from defaults so a
# 2-vCPU/4GB-RAM node can host the full default stack comfortably.
laravel:
  replicas: 2
horizon:
  replicas: 1
agentWorker:
  replicas: 2
