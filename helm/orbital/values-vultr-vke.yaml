# Vultr Kubernetes Engine (managed control plane) — PRODUCTION overrides.
#
# This is the first production environment overlay. It assumes the cluster
# and the SIP edge VMs were already provisioned by the orbital-setup repo
# (terraform/vultr/managed-vke/), which also installs ingress-nginx +
# cert-manager before this chart goes in.
#
# Apply with (see "Production" in README.md for the full flow):
#   helm install orbital oci://cr.calltheory.com/orbital/charts/orbital \
#     -f ./helm/orbital/values-vultr-vke.yaml \
#     --set global.domain=orbital.your-company.com \
#     --set global.image.tag=<released-version> \
#     --set telephony.kamailio.jsonrpcUrl=http://<edge-vm-ip>:8090/jsonrpc \
#     --set agentWorker.token=<strong-random-token>
#
# VKE ships:
# - vultr-block-storage CSI driver (RWO)
# - Vultr cloud controller (managed LB for Service type=LoadBalancer)
# - NO ingress controller by default — the OpenTofu VKE module
#   installs ingress-nginx + cert-manager via separate Helm releases
#   before this chart goes in.

global:
  storageClass: "vultr-block-storage"
  # Immutable version tags in prod (not :dev) — IfNotPresent is correct,
  # every release is a distinct tag so nodes never serve a stale layer.
  image:
    pullPolicy: IfNotPresent

ingress:
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"     # large for media uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # WSS keepalive
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  # Real TLS in prod: cert-manager issues a Let's Encrypt cert for the
  # ingress host. Requires DNS pointing at the Vultr LB first (the
  # ACME HTTP-01 challenge fails otherwise).
  tls:
    enabled: true
  tlsAnnotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

# SIP edge (Kamailio + rtpengine) runs on dedicated VMs OUTSIDE the
# cluster — provisioned by orbital-setup, never in-cluster in prod. The
# in-cluster app reaches Kamailio's JSON-RPC to reload the dispatcher and
# read edge health. The VM IP is deploy-specific: set jsonrpcUrl via
# --set (or a private per-customer values file) — leave it here so the
# chart default (false) doesn't silently ship with the edge card red.
telephony:
  kamailio:
    enabled: true
    # jsonrpcUrl: "http://<edge-vm-ip>:8090/jsonrpc"   # set per deploy

# Once the observability stack (Grafana/Prometheus/Loki/Promtail) is
# confirmed reachable and TLS is issued, drop those keys + `tls` from this
# list so their cards go green instead of showing "not deployed". Kept
# disabled on first install so the dashboard isn't red before DNS/certs
# and the monitoring release land.
health:
  disabledComponents: "prometheus,loki,grafana,promtail,tempo,alertmanager,icecast,ollama,whisper_local,haproxy,mail,haraka,pgadmin,redis_commander,tls"

# Real multi-node cluster, so co-location is refused rather than merely
# discouraged: with maxSkew 1 across 3 nodes, two replicas of a tier can
# never land on the same host. Losing a node still leaves room to
# reschedule. On a single-node cluster this would block scheduling
# entirely, which is why the chart default is ScheduleAnyway.
spreadPods:
  required: true

# THE DATA TIER IS SINGLE-REPLICA IN-CLUSTER BY DEFAULT.
#
# The chart's Postgres, Valkey and SeaweedFS StatefulSets are one pod
# each — fine for a first install, not what you want under real traffic.
# Neither survives losing its node, and a lost block-storage volume is
# unrecoverable without the backups below.
#
# For production on Vultr, point the two that matter at managed
# services. That gets you replication, snapshots and provider-run
# backups without this chart pretending to be a database operator:
#
#   postgres:
#     external:
#       enabled: true
#       host: "<vultr-managed-pg-host>"
#       port: 16751
#       database: orbital
#       username: orbital
#   objectStorage:
#     external:
#       enabled: true
#       s3Endpoint: "https://ewr1.vultrobjects.com"
#       bucket: orbital-media
#
# ...with `postgres-creds` / `object-storage-creds` Secrets alongside.
# See templates/secrets.example.yaml.

# Encrypted nightly database backup. Turn this on BEFORE real traffic:
# HA covers a dead node and replication covers a dead disk, but neither
# covers a dropped table or a bad migration.
backups:
  enabled: false      # set true and supply the secrets — see docs/admin/backups.md
  bucket: ""
  endpoint: "https://ewr1.vultrobjects.com"

# Asterisk runs multi-replica on plain vultr-block-storage (RWO) now —
# the dialplan/prompt handoff is via object storage, not a shared RWX
# PVC. No longhorn / NFS class needed. Scaled to 2 for HA.
asterisk:
  replicas: 2

horizon:
  replicas: 1
agentWorker:
  replicas: 2

# Single laravel block (merged): 2 replicas for HA, plus tighter
# pod-level resource bounds for managed VKE — the control plane is
# "free" but worker nodes are billed, so trim limits to avoid
# over-provisioning per-pod.
laravel:
  replicas: 2
  resources:
    requests: {cpu: "200m", memory: "384Mi"}
    limits: {cpu: "1000m", memory: "1Gi"}
