# Orbital Helm chart — default values.
#
# Every knob below is overridable via per-provider values files
# (values-vultr-k3s.yaml, values-vultr-vke.yaml, values-onprem-k3s.yaml)
# or via `--set` on the command line. Defaults assume a fresh K3s cluster
# with everything in-cluster — `helm install` produces a working Orbital
# without any external service dependencies.

global:
  # Image registry. Defaults to Patrick's Harbor; per-customer values
  # files override. The chart concatenates {registry}/{repository}/<image>
  # for every Pod's image reference.
  image:
    registry: cr.calltheory.com
    repository: orbital
    tag: 0.1.0
    pullPolicy: IfNotPresent

  # Pull-secret name(s) every Pod attaches. Customers create the secret
  # themselves with their per-customer Harbor robot-account credentials:
  #
  #   kubectl create secret docker-registry orbital-registry-creds \
  #     --docker-server=cr.calltheory.com \
  #     --docker-username='robot$<customer>-pull' \
  #     --docker-password='<token>'
  imagePullSecrets:
    - name: orbital-registry-creds

  # Customer-facing domain. Sub-resources derive from it (admin, sip,
  # webhook, etc.). The ingress host is always this value.
  domain: orbital.example.com

  # Public application URL (APP_URL). Defaults to https://<domain>.
  # Override for local/dev http access, e.g. http://orbital.localhost:8080,
  # so Filament asset URLs match the origin you actually browse.
  appUrl: ""

  # Storage class for PVCs. Empty = use cluster default. Provider
  # overrides set this explicitly (vultr-block-storage, gp3, etc.).
  storageClass: ""

# ============================================================================
# Application tier — Orbital-specific code
# ============================================================================

laravel:
  enabled: true
  replicas: 2
  image:
    name: laravel       # full ref: {registry}/{repository}/laravel:{tag}
    tag: ""             # blank = inherit global.image.tag
  resources:
    requests: {cpu: "250m", memory: "512Mi"}
    limits: {cpu: "1500m", memory: "2Gi"}
  service:
    port: 80            # cluster Service port (ingress + intra-cluster callers)
    targetPort: 8080    # container port — nginx listens unprivileged so the
                        # pod runs fully non-root (no NET_BIND_SERVICE needed)
  env: {}               # extra env vars merged with chart-defined defaults

horizon:
  enabled: true
  replicas: 1
  # Horizon shares the laravel image — same code, different command.
  resources:
    requests: {cpu: "200m", memory: "512Mi"}
    limits: {cpu: "1000m", memory: "1Gi"}

scheduler:
  enabled: true
  replicas: 1
  # Shares the laravel image; runs `php artisan schedule:work` so cron
  # tasks (heartbeat, prunes, rollups, cert checks) actually fire.
  resources:
    requests: {cpu: "50m", memory: "192Mi"}
    limits: {cpu: "500m", memory: "512Mi"}

reverb:
  enabled: true
  replicas: 1
  # Reverb (Pusher-protocol) app identity. appId + appKey are public
  # (browsers use the key) and rendered into app-env. The matching
  # secret is NOT here — it's REVERB_APP_SECRET in the app-secrets
  # Secret (see secrets.example.yaml), so it never lands in a ConfigMap
  # or in `helm get values`. All three must agree across the Reverb
  # server and the Laravel/Horizon broadcasters.
  appId: orbital
  appKey: "orbital-local-key"
  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "500m", memory: "512Mi"}
  service:
    port: 8080

asterisk:
  enabled: true
  # StatefulSet because Kamailio's dispatcher uses node identity
  # (`asterisk-0` / `asterisk-1` are stable hostnames). Replicas
  # grow horizontally — each new node automatically registers in
  # the dispatcher pool when Laravel regenerates the list.
  replicas: 2
  image:
    name: asterisk
    tag: ""
  resources:
    requests: {cpu: "500m", memory: "1Gi"}
    limits: {cpu: "2000m", memory: "2Gi"}
  persistence:
    # Spool dir for voicemail + recordings. PVC is per-pod (RWO — works
    # on any block-storage class, no RWX needed); cluster default
    # storage class unless `global.storageClass` is set.
    enabled: true
    size: 10Gi
  # Sidecar that syncs generated dialplan + TTS prompts from object
  # storage into each Asterisk pod, and reloads Asterisk when the
  # dialplan version marker changes. Replaces the old ReadWriteMany
  # shared PVC — so `asterisk.replicas` can now scale freely on plain
  # block storage (no RWX provisioner required).
  configSync:
    image:
      name: asterisk-config-sync   # {registry}/{repository}/asterisk-config-sync:{tag}
      tag: ""                       # blank = inherit global.image.tag
    syncIntervalSeconds: 10
    resources:
      requests: {cpu: "25m", memory: "32Mi"}
      limits: {cpu: "100m", memory: "128Mi"}
  # LOCAL-EDGE TEST ONLY. Exposes Asterisk SIP + a bounded RTP range via
  # NodePort so an OFF-cluster rtpengine (local/edge/) can relay media
  # into the pod, and makes pjsip advertise a reachable address. NEVER
  # enable in production — there the media edge lives on VMs. Enabled by
  # values-local-edge.yaml; keep replicas at 1 when using it so the RTP
  # NodePorts map to a single pod (no media round-robin).
  edgeExpose:
    enabled: false
    externalAddress: ""   # reachable IP Asterisk advertises in SDP (a k3d node IP)
    sipNodePort: 31060    # NodePort for SIP 5060 (must be in 30000-32767)
    rtpStart: 31000       # RTP window, NodePort-exposed 1:1 (node:P -> pod:P)
    rtpEnd: 31049

livekit:
  enabled: true
  replicas: 1
  # Public API-key half. MUST match LIVEKIT_API_KEY in the app-secrets
  # Secret. Used for webhook signature verification against the Laravel
  # app. This is a public identifier (not sensitive); the secret half
  # never leaves the Secret and reaches the pod via LIVEKIT_KEYS env.
  apiKey: "APIorbitaldev"
  # Third-party image. Defaults to docker.io; override if mirrored.
  image:
    registry: docker.io
    repository: livekit
    name: livekit-server
    tag: latest
  resources:
    requests: {cpu: "500m", memory: "512Mi"}
    limits: {cpu: "2000m", memory: "2Gi"}
  service:
    port: 7880

livekitSip:
  enabled: true
  replicas: 1
  image:
    registry: docker.io
    repository: livekit
    name: sip
    tag: latest
  resources:
    requests: {cpu: "200m", memory: "256Mi"}
    limits: {cpu: "1000m", memory: "1Gi"}
  service:
    sipPort: 5069   # cluster-internal SIP only — no wide UDP RTP
                    # range; rtpengine at the edge owns RTP relay.

agentWorker:
  enabled: true
  replicas: 2
  image:
    name: agent-worker
    tag: ""
  # Shared bearer token for the worker's heartbeat POST to the Laravel
  # API (which gates it on the same value). k8s ignores the image's
  # Docker HEALTHCHECK, so a readiness-probe exec posts it instead.
  token: "orbital-dev-agent-token"
  resources:
    requests: {cpu: "250m", memory: "512Mi"}
    limits: {cpu: "1000m", memory: "1Gi"}

# Telephony edge (Kamailio) reachability from the in-cluster app. In a
# real deploy the edge is on VMs; point jsonrpcUrl at them. For the local
# edge test (values-local-edge.yaml) it's the host-published Kamailio.
telephony:
  kamailio:
    enabled: false
    jsonrpcUrl: ""   # e.g. http://host.k3d.internal:8090/jsonrpc

# System-status dashboard. The health probes were written for the
# all-in-one docker-compose stack; components NOT present in this
# in-cluster topology (observability, the compose-only LB, optional
# AI/media, dev tools) render as "not deployed" instead of red. In-
# cluster + edge services are probed at their real addresses. Override
# per deploy — e.g. drop grafana/prometheus from the list once the
# observability stack is installed alongside.
health:
  disabledComponents: "prometheus,loki,grafana,promtail,tempo,alertmanager,icecast,ollama,whisper_local,haproxy,mail,haraka,pgadmin,redis_commander,tls"

# ============================================================================
# Licensing — AGPL section 13 source offer
# ============================================================================
#
# Orbital is AGPL-3.0. If you run MODIFIED Orbital and let anyone use it
# over a network, section 13 asks you to offer them the source of what
# they are actually running.
#
# Orbital does that for you: the footer of every panel, /source, and
# /api/version all read sourceUrl. POINT IT AT YOUR OWN REPOSITORY when
# you fork. Leaving it aimed upstream sends your users to source that
# isn't yours.
licensing:
  sourceUrl: "https://git.calltheory.com/calltheory/orbital"
  releaseChannel: stable

# ============================================================================
# Metrics
# ============================================================================
#
# /metrics on each Laravel pod carries per-pod HTTP metrics. Deployment-wide
# numbers (per-client volume, queue depth, Asterisk state) are PUSHED once a
# minute by the scheduler pod, so N replicas don't each report the same
# global total — see config/metrics.php.
#
# Point pushgateway.url at a Pushgateway in your monitoring namespace, or
# disable it if you aren't collecting metrics yet.
metrics:
  enabled: true
  pushgateway:
    enabled: false
    url: "http://pushgateway.monitoring.svc.cluster.local:9091"

# ============================================================================
# Backups
# ============================================================================
#
# Nightly encrypted PostgreSQL backup, run by the scheduler pod — no
# CronJob needed, `schedule:work` already owns the timetable.
#
# HA covers a dead node, replication covers a dead disk. Neither covers a
# dropped table or a bad migration; those replicate to every copy. This
# is the only mechanism that recovers from a mistake, and it is the one
# thing on this page that should be on before you carry real traffic.
#
# Secrets are NOT here — BACKUP_ENCRYPTION_KEY, BACKUP_AWS_ACCESS_KEY_ID
# and BACKUP_AWS_SECRET_ACCESS_KEY go in the app-secrets Secret. See
# templates/secrets.example.yaml.
#
# LOSING THE ENCRYPTION KEY MEANS LOSING EVERY ARCHIVE TAKEN WITH IT.
# Store it in your secret manager, not only in the cluster it protects.
backups:
  enabled: false
  keepDays: 30

  # Destination bucket. Use a DIFFERENT bucket and a DIFFERENT key from
  # the app's object storage: backups kept under the credential the app
  # writes recordings with die to the same compromised key or buggy
  # delete that destroys the recordings.
  bucket: ""
  endpoint: ""
  region: "us-east-1"

# ============================================================================
# Schema migrations
# ============================================================================
#
# Runs `php artisan migrate --force` as a Helm hook: post-install on a
# fresh release (the in-cluster Postgres StatefulSet does not exist yet
# during pre-install, so there would be nothing to connect to) and
# pre-upgrade on every release after that, so the new schema lands
# BEFORE the new pods roll. A pod serving new code against an old
# schema is the failure this exists to prevent.
#
# Turn `enabled` off only if you run migrations from your own pipeline.
# Nothing else in the chart applies them, so off means you own that step.
migrations:
  enabled: true

  # Seed reference data on the FIRST install only — permissions, roles,
  # the first super admin, hold-music classes, the intake-goal library.
  # A migrated-but-unseeded database loads a panel nobody can log in to
  # and administer. Never re-run on upgrade: DatabaseSeeder is safe in
  # production (demo data is gated behind the `local` environment) but
  # re-seeding every release would fight an operator's own edits to the
  # same reference rows.
  seedOnInstall: true

  # How long the init container waits for Postgres to accept
  # connections. Generous because on a fresh install the database
  # container is starting at the same moment, and initdb on a cold
  # block-storage volume is not fast.
  waitForDbSeconds: 300

  # Job retries. A migration that fails for a real reason fails the
  # release, which is what you want; these retries are for transient
  # connection loss during a rolling data-tier restart.
  backoffLimit: 3

  resources:
    requests: {cpu: "100m", memory: "256Mi"}
    limits: {cpu: "1000m", memory: "1Gi"}

# ============================================================================
# Observability integrations — optional, off by default
# ============================================================================
#
# Neither of these ships a backend. Same posture the chart already takes
# toward Prometheus/Grafana/Loki: a Kubernetes install is assumed to have an
# observability stack of its own, or to be pointing at a hosted one, and
# duplicating it inside this chart would fight whatever the cluster already
# runs. The compose stack ships Tempo as an opt-in overlay
# (compose/obs-tracing.yml) because there is nothing else there to use.
#
# READ THIS BEFORE ENABLING EITHER. Orbital handles other people's callers.
# Spans carry identifiers only and error reports are scrubbed before they
# leave the pod, but pointing these at a hosted backend still exports your
# clients' operational data to a third party. If you run Orbital under a BAA
# or a DPA, check that first.
#
# Secrets do NOT go here — the DSN and the OTLP credential belong in the
# app-secrets Secret. See templates/secrets.example.yaml.
observability:
  # Distributed tracing over OTLP/HTTP. Point at Tempo, an OpenTelemetry
  # Collector, or a vendor endpoint. Sampling defaults to 5%: a call center
  # serves a lot of requests and tracing all of them costs a great deal
  # without answering anything extra.
  tracing:
    enabled: false
    endpoint: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
    serviceName: "orbital"
    sampleRatio: 0.05
    # none | basic | bearer. Credentials come from app-secrets:
    # TRACING_AUTH_USERNAME and TRACING_AUTH_SECRET.
    authMode: "none"

  # Unhandled exceptions to GlitchTip, Sentry, or anything speaking the same
  # ingest API. The DSN lives in app-secrets as ERROR_REPORTING_DSN; without
  # it this stays off however this flag is set, which is deliberate.
  errors:
    enabled: false
    # Blank uses the app environment. Set it when several installs report
    # into one project and need telling apart.
    environment: ""

# ============================================================================
# Security
# ============================================================================
#
# Two-factor is required for every user — platform staff and client portal
# users alike. The grace clock starts on each user's FIRST REQUEST under the
# policy, not at account creation, so turning this on does not lock out
# existing users. Per-client windows override the default on the client record.
security:
  twoFactorRequired: true
  twoFactorGraceDays: 7

# ============================================================================
# Stateful dependencies — in-cluster by default, external opt-in
# ============================================================================

postgres:
  external:
    enabled: false
    # When external.enabled=true, populate these and create a
    # `postgres-creds` secret with `password`.
    host: ""
    port: 5432
    database: orbital
    username: orbital
    sslMode: prefer
  # In-cluster (default) deploys a single-replica StatefulSet for
  # the "fresh install just works" path. HA Postgres is a future
  # opt-in (Patroni operator) or external managed.
  inCluster:
    image:
      # pgvector-enabled Postgres (official postgres:16 + the `vector`
      # extension). The knowledge-store / RAG migrations run
      # `CREATE EXTENSION vector`, which stock postgres:16 lacks — so a
      # plain postgres image fails `migrate` on any install, local or cloud.
      registry: docker.io
      repository: pgvector
      name: pgvector
      tag: "pg16"
    persistence:
      size: 20Gi
    resources:
      requests: {cpu: "500m", memory: "512Mi"}
      limits: {cpu: "2000m", memory: "2Gi"}

valkey:
  external:
    enabled: false
    host: ""
    port: 6379
    sentinelHost: ""    # blank = no Sentinel; use external.host directly
    sentinelPort: 26379
    # `valkey-creds` secret carries the password.
  # In-cluster (default) deploys single-replica Valkey. HA Valkey
  # (Sentinel-backed) is a future opt-in or external managed.
  inCluster:
    image:
      registry: docker.io
      repository: valkey
      name: valkey
      tag: "8"
    persistence:
      size: 5Gi
    resources:
      requests: {cpu: "100m", memory: "256Mi"}
      limits: {cpu: "500m", memory: "1Gi"}

objectStorage:
  external:
    enabled: false
    # S3-compatible endpoint. Vultr Object Storage, AWS S3, etc.
    s3Endpoint: ""
    region: ""
    bucket: orbital-recordings
    # `object-storage-creds` secret carries access_key + secret_key.
  # In-cluster (default) deploys a single-pod combined SeaweedFS
  # (master + volume + filer in `weed server` mode). HA SeaweedFS
  # with separate masters / volumes / filers is a future opt-in or
  # external S3-compatible (Vultr / AWS / etc).
  inCluster:
    image:
      registry: docker.io
      repository: chrislusf
      name: seaweedfs
      tag: "3.74"
    persistence:
      volumeSize: 50Gi
    resources:
      requests: {cpu: "200m", memory: "256Mi"}
      limits: {cpu: "1000m", memory: "1Gi"}

# ============================================================================
# Ingress — public-facing entry point
# ============================================================================

ingress:
  enabled: true
  className: ""           # provider-specific; e.g. "traefik", "nginx", "alb"
  # Always-applied annotations (e.g. nginx proxy-body-size).
  annotations: {}
  # Applied ONLY when tls.enabled — cert-manager issuer, traefik
  # websecure/tls, etc. Kept separate so a TLS-off dev install isn't
  # pinned to the https entrypoint (which 404s plain-http requests).
  tlsAnnotations: {}
  # The public host is always global.domain (kept in lockstep with
  # APP_URL). Paths route to in-cluster services.
  paths:
    - path: /
      pathType: Prefix
      service: laravel
    - path: /app
      pathType: Prefix
      service: reverb       # WSS endpoint for the Filament real-time panel
  tls:
    # When enabled, TLS is served for global.domain from `secretName`
    # (populated by cert-manager when a cluster-issuer annotation is set,
    # or provisioned manually). Disable on local/dev clusters that have
    # no cert-manager.
    enabled: true
    secretName: ""          # blank = {release}-orbital-tls

# ============================================================================
# Failover / status-page tier modes
# ============================================================================
#
# Generated env vars from these (via configmap-failover-tiers.yaml):
#   ORBITAL_FAILOVER_POSTGRES_MODE
#   ORBITAL_FAILOVER_VALKEY_MODE
#   ORBITAL_FAILOVER_OBJECT_STORAGE_MODE
#
# Values: cluster | managed | none
# - cluster: full Patroni/Sentinel/SeaweedFS-aware monitoring + drain UI
# - managed: simple connectivity probe; FailoverCentral hides the tier
# - none:    no probe at all; tier hidden everywhere
#
# Defaults derived from the per-tier `external.enabled` flag (cluster vs
# managed), but each can be force-set via the explicit `mode` knob below.

failoverTiers:
  postgres:
    mode: ""              # blank = derive from postgres.external.enabled
  valkey:
    mode: ""
  objectStorage:
    mode: ""

# ============================================================================
# Common pod settings
# ============================================================================

podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]

# ============================================================================
# Pod spreading — makes "2 replicas" mean "2 nodes"
# ============================================================================
#
# Kubernetes schedules for fit, not for surviving a node loss, so
# without this both Laravel replicas (and both Asterisk pods, and both
# agent-workers) can land on the same node and a single node failure
# takes the tier down. That is the difference between configured
# redundancy and actual redundancy.
#
# `required: false` by default so a single-node dev or k3s cluster still
# schedules everything. On a real multi-node cluster set it to true and
# have Kubernetes refuse to co-locate rather than quietly doing it.
spreadPods:
  enabled: true
  required: false

# ============================================================================
# Disruption budgets — survive a node drain, not just a node crash
# ============================================================================
#
# A `kubectl drain` during a provider maintenance window (or a VKE node
# upgrade) evicts pods with no regard for how many of a tier are left
# unless a PodDisruptionBudget says otherwise. Without one, a rolling
# node upgrade can take out every replica of a tier at once — an outage
# caused by routine maintenance, which is the most annoying kind.
#
# Only rendered for tiers running more than one replica; a PDB over a
# single-replica Deployment blocks drains forever instead of protecting
# anything.
podDisruptionBudgets:
  enabled: true
  maxUnavailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
