site_name: Orbital Documentation
site_description: User and admin documentation for the Orbital answering-service platform.
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: emerald
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: emerald
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - First Login: getting-started/first-login.md
    - Deploying to Vultr (VKE): getting-started/vultr-vke.md
  - Admin Guide:
    - Clients: admin/clients.md
    - Email Routing: admin/email-routing.md
    - Messaging: admin/messaging.md
    - Agent Groups: admin/agent-groups.md
    - Users & Roles: admin/users-roles.md
    - High Availability: admin/high-availability.md
    - Observability: admin/observability.md
    - Backups: admin/backups.md
  - Operator Guide:
    - Email Inbox: operator/email-inbox.md
    - Softphone: operator/softphone.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
