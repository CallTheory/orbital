# pnpm 11 replaced `onlyBuiltDependencies` (a list) with `allowBuilds`
# (a map of package matcher -> bool), and defaults `strictDepBuilds` to
# true — so any dependency with an un-reviewed build script fails the
# install. esbuild needs its build script; allow it explicitly.
allowBuilds:
  esbuild: true

# Refuse packages published less than a day ago (minutes). Lives here
# because pnpm 11 no longer reads pnpm settings from .npmrc. Keep in
# step with `minimumReleaseAge` in renovate.json so Renovate doesn't
# open PRs that `pnpm install` would reject.
minimumReleaseAge: 1440
